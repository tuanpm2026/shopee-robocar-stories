g","audio":"audio/10.mp3","text":"Cap chạy bon bon đưa cả nhà về khách sạn cạnh biển Mỹ Khê. Cát trắng mịn như bột, nước biển xanh ngắt, sóng vỗ rì rào. Trên trời, một chiếc trực thăng xanh lá đang bay lượn, dưới bãi cát là chị Jin tóc vàng đeo tai nghe đỏ cầm bộ đàm. Shopee mừng rỡ chào anh Helly và chị Jin. Chị Jin kể đội cứu hộ đến đây trực để giữ an toàn cho mọi người, rồi chỉ cho bé những lá cờ cắm dọc bãi: vùng cờ xanh có phao giăng là vùng nước an toàn, sóng êm, có cứu hộ trông chừng — chỉ tắm ở đó thôi; còn nơi cắm cờ đỏ là vùng nguy hiểm, sóng to xoáy ngầm, tuyệt đối không xuống nước."},{"image":"page11.png","audio":"audio/11.mp3","text":"Anh Helly bay sà xuống thấp, cánh quạt quay tít, dặn thêm rằng mình bay tuần tra trên cao, thấy ai bơi ra quá xa là nhắc liền. Helly nhắn Shopee nhớ luôn tắm gần bố mẹ, trong tầm mắt bố mẹ, thấy đuối hay mệt là kêu to gọi người lớn ngay, đừng ngại. Shopee định chạy ào xuống nước thì một chiếc xe cứu thương trắng hồng tên Amber gọi với theo: khoan đã nào, nắng biển gắt lắm, phải bôi kem chống nắng, đội mũ, uống đủ nước rồi mới ra chơi nắng được, không thì tối về da đỏ rát đau lắm. Mẹ bôi kem khắp tay chân mặt mũi cho Shopee, bé nhắm tịt mắt, mặt trắng lốp như chú hề nhỏ làm ai cũng bật cười."},{"image":"page12.png","audio":"audio/12.mp3","text":"Rồi bố dẫn Shopee đứng trên cát và bảo: trước khi xuống nước, hai bố con mình khởi động đã nhé! Xoay cổ tay, xoay cổ chân, vươn vai nào — một, hai, ba, bốn! Khởi động kỹ thì xuống nước người mình dẻo dai, không bị chuột rút. Hai bố con vừa hô vừa tập, Shopee bắt chước bố xoay tay xoay chân thật đều."},{"image":"page13.png","audio":"audio/13.mp3","text":"Xong xuôi, bố nắm tay Shopee lội xuống vùng nước cờ xanh. Sóng nhỏ ào tới mơn man chân bé, mát ơi là mát. Shopee nhảy sóng cùng bố, cười vang cả góc biển. Thỉnh thoảng sóng to hơn một chút, bé lại bám chặt tay bố, vì bé nhớ lời anh Helly: luôn ở cạnh bố mẹ."},{"image":"page14.png","audio":"audio/14.mp3","text":"Đang chơi, Shopee thấy một chiếc xe nhỏ màu vàng có nơ hồng đứng nép trên bờ cát, bánh xe cứ nhích tới lại lùi ra, không dám chạm vào nước. Đó là bạn Mini. Mini thú thật là muốn lắm nhưng sóng cứ ào ào nên sợ. Shopee động viên bạn: tớ lúc đầu cũng hơi sợ mà, nhưng có bố nắm tay, có chị Jin và anh Helly trông chừng, lại tắm đúng chỗ cờ xanh nữa; dũng cảm là dù sợ vẫn cứ thử, bạn chạm một tí nước thôi nhé. Mini rụt rè lăn bánh tới mép nước, một con sóng nhỏ vuốt qua bánh xe mát rượi. Mini tròn mắt rồi cười khúc khích: mát ghê, tớ làm được rồi, tớ chạm vào biển rồi!"},{"image":"page15.png","audio":"audio/15.mp3","text":"Chơi sóng chán chê, Shopee và Mini lên bờ xây lâu đài cát. Bố đắp tường thành, Shopee xúc cát đổ tháp, Mini chở cát ướt tới, chẳng mấy chốc một tòa lâu đài to tướng mọc lên. Đúng lúc ấy, một chiếc xe cắm trại màu xanh ngọc tên Camp chạy ngang, khen lâu đài đẹp nhất bãi biển, rồi chỉ cho các bạn thấy một vỏ túi bánh ai bỏ quên đang bị gió thổi lăn về phía biển. Camp bảo: bãi biển đẹp là nhờ ai đến chơi cũng mang rác về thùng; nếu vỏ bánh trôi xuống biển, các bạn cá ăn nhầm sẽ đau bụng; người đi du lịch giỏi là người chơi xong không để lại gì ngoài dấu chân trên cát. Shopee liền chạy đi nhặt vỏ bánh bỏ gọn vào thùng rác."},{"image":"page16.png","audio":"audio/16.mp3","text":"Chơi cả buổi, bụng Shopee đói meo. Cả nhà vào một quán ăn nhỏ ven biển. Shopee định bốc ngay miếng bánh tráng thì mẹ giữ tay bé lại: khoan nào, bàn tay con nghịch cát cả buổi, đầy cát và vi khuẩn, trước khi ăn phải rửa tay với xà phòng. Shopee chạy đi rửa tay sạch bong rồi mới ngồi vào bàn. Cô chủ quán bưng ra một tô mì Quảng vàng ươm, có tôm đỏ au, thịt gà, đậu phộng và bánh tráng giòn rụm. Shopee nhìn món lạ, ngần ngừ sợ không ngon. Bố khuyến khích: đi du lịch mà không nếm món ngon của vùng đất mình đến thì phí lắm, con thử một miếng nhỏ trước, biết đâu lại thích mê. Shopee rón rén nếm thử rồi mắt sáng bừng: ngon quá, thơm thơm béo béo giòn giòn! Bé ăn ngoan gần hết tô, nhai kỹ từng miếng, ăn xong còn khoanh tay cảm ơn cô chủ quán."},{"image":"page17.png","audio":"audio/17.mp3","text":"Buổi chiều, cả nhà ra cảng cá gần đó. Một chiếc tàu thủy xanh trắng đội mũ thuyền trưởng tên Marine đang neo bên bến, thấy Shopee liền kéo còi chào tu tu. Marine mời cả nhà lên tàu đi một vòng ngắm biển Đà Nẵng từ ngoài khơi, nhưng dặn trước tiên mỗi người phải mặc một chiếc áo phao: lên tàu thuyền là phải mặc áo phao, dù mình biết bơi hay không, vì áo phao sẽ giữ mình nổi trên nước nếu chẳng may trượt chân. Shopee mặc áo phao màu cam, cài khóa cẩn thận, ngồi ngoan giữa bố và mẹ, hai tay bám chắc vào ghế, không nghiêng người ra mạn tàu. Marine rẽ sóng chạy ra khơi, gió biển mát lộng, đàn hải âu chao liệng."},{"image":"page18.png","audio":"audio/18.mp3","text":"Trời sập tối, cả thành phố lên đèn lung linh. Bố mẹ dẫn Shopee ra cầu Rồng — cây cầu có con rồng vàng khổng lồ uốn mình vắt qua sông Hàn. Người xem đứng đông nghìn nghịt. Mẹ cúi xuống dặn: chỗ này đông người lắm, con nhớ nắm chặt tay bố mẹ, không tự ý chạy đi đâu; nếu chẳng may lạc, con đứng yên một chỗ, không đi theo người lạ, và tìm chú công an hay cô chú nhân viên nhờ giúp đỡ. Vừa lúc đó, một chiếc xe cảnh sát trắng xanh quen thuộc tên Poli đi tuần ngang qua, nháy đèn chào và khen Shopee nói đúng lắm: bạn nhỏ nào lạc bố mẹ cứ tìm các anh cảnh sát. Rồi con rồng vàng ngẩng đầu, phun ra những cột lửa rực sáng cả mặt sông. Shopee ngồi trên vai bố, vỗ tay reo hò không ngớt."},{"image":"page19.png","audio":"audio/19.mp3","text":"Rồng vừa phun lửa xong, bố lại nháy mắt bí ẩn báo tin: đêm nay bên sông Hàn còn có lễ hội pháo hoa nữa. Cả nhà nắm tay nhau ra khán đài, tìm đúng hàng ghế của mình rồi ngồi ngay ngắn. Mẹ cúi xuống dặn nhỏ: xem pháo hoa mình ngồi yên tại chỗ, không đứng lên chạy xuống lối đi kẻo che mất tầm nhìn của các bạn phía sau; còn nếu tiếng pháo nổ to quá thì cứ bịt nhẹ hai tai lại. Rồi đoàng, đoàng — bầu trời đêm bừng sáng, muôn ngàn bông hoa lửa đỏ, vàng, xanh, tím thi nhau nở xòe rồi rơi xuống lấp lánh như mưa sao, soi sáng cả mặt sông Hàn. Shopee ngửa cổ ngắm, ngồi ngoan trong ghế của mình từ đầu đến cuối, chỉ có đôi mắt là bận rộn chạy theo từng chùm pháo hoa rực rỡ. Mấy ngày nghỉ trôi qua nhanh như một giấc mơ đẹp, và Shopee đã thành một hành khách nhí thật giỏi giang trên chuyến bay về."},{"image":"page20.png","audio":"audio/20.mp3","text":"Bài học cho bé. Đi du lịch xa thật vui, và bé sẽ vui hơn nữa khi nhớ những điều này. Một, ở sân bay và nơi đông người: luôn nắm chặt tay bố mẹ, không chạy lung tung, xếp hàng ngay ngắn không chen lấn; nếu lạc thì đứng yên một chỗ, không theo người lạ, tìm chú công an hoặc nhân viên nhờ giúp đỡ. Hai, trên máy bay và ô tô: ngồi đúng chỗ, thắt dây an toàn ngay khi ngồi xuống, không đạp ghế, không la hét, không thò đầu thò tay ra cửa sổ; tai bị ù thì ngáp to hoặc nuốt nước bọt là hết. Ba, khi tắm biển: bôi kem chống nắng, đội mũ, uống đủ nước, khởi động trước khi xuống nước, chỉ tắm ở vùng cờ xanh có cứu hộ và luôn ở gần bố mẹ; lên tàu thuyền phải mặc áo phao. Bốn, khi ăn uống: rửa tay sạch trước khi ăn, mạnh dạn nếm thử món ngon của vùng đất mới, nhai kỹ và không vừa ăn vừa chạy nhảy, ăn xong nhớ cảm ơn người nấu. Năm, yêu thiên nhiên: không vứt rác ra bãi biển hay xuống biển, chơi xong chỉ để lại dấu chân trên cát thôi nhé!"}]}];
const AUTO_ADVANCE_DELAY = 1000;

const library  = document.getElementById("library");
const reader   = document.getElementById("reader");
const grid     = document.getElementById("grid");
const img      = document.getElementById("slideImg");
const caption  = document.getElementById("caption");
const pageNum  = document.getElementById("pageNum");
const dots     = document.getElementById("dots");
const btnPlay  = document.getElementById("btnPlay");
const startOverlay = document.getElementById("startOverlay");
const endOverlay   = document.getElementById("endOverlay");
const audio = new Audio();

let storyIdx = 0;
let SLIDES = [];
let base = "";
let cur = 0;
let playing = false;
let advanceTimer = null;

/* ---------- Auto-open next story ---------- */
const AUTO_NEXT_SECONDS = 10;
let autoNextTimer = null;
const chkAutoNext = document.getElementById("chkAutoNext");
const autoNextCountdownEl = document.getElementById("autoNextCountdown");
chkAutoNext.checked = localStorage.getItem("autoNext") !== "0";   // default ON

function cancelAutoNext() {
  clearInterval(autoNextTimer);
  autoNextTimer = null;
  autoNextCountdownEl.textContent = "";
}

function goNextStory() {
  cancelAutoNext();
  openStory((storyIdx + 1) % STORIES.length);
  startOverlay.classList.remove("show");
  playing = true;
  go(0);
}

function startAutoNext() {
  cancelAutoNext();
  if (!chkAutoNext.checked || STORIES.length < 2) return;
  let remain = AUTO_NEXT_SECONDS;
  const nextTitle = STORIES[(storyIdx + 1) % STORIES.length].title;
  const tick = () => {
    if (remain <= 0) { goNextStory(); return; }
    autoNextCountdownEl.textContent = "➡️ Tự động mở “" + nextTitle + "” sau " + remain + "s…";
    remain--;
  };
  tick();
  autoNextTimer = setInterval(tick, 1000);
}

chkAutoNext.addEventListener("change", () => {
  localStorage.setItem("autoNext", chkAutoNext.checked ? "1" : "0");
  if (chkAutoNext.checked && endOverlay.classList.contains("show")) startAutoNext();
  else cancelAutoNext();
});

/* ---------- Library ---------- */
STORIES.forEach((st, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="thumb"><img loading="lazy" src="' + st.base + '/' + st.cover + '" alt="">' +
    '<span class="num">' + st.n + '</span></div>' +
    '<div class="cap">' + st.title + '</div>';
  card.addEventListener("click", () => openStory(i));
  grid.appendChild(card);
});

function openStory(i) {
  storyIdx = i;
  const st = STORIES[i];
  SLIDES = st.slides;
  base = st.base;
  cur = 0;
  playing = false;
  clearTimeout(advanceTimer);
  cancelAutoNext();
  audio.pause();

  dots.innerHTML = "";
  SLIDES.forEach((_, k) => {
    const d = document.createElement("span");
    d.addEventListener("click", () => go(k, true));
    dots.appendChild(d);
  });

  document.getElementById("startCover").src = base + "/" + st.cover;
  document.getElementById("startTitle").textContent = st.title;
  document.getElementById("startSub").innerHTML =
    "Giọng kể: chị HoaiMy &nbsp;•&nbsp; " + (SLIDES.length - 1) + " trang";
  endOverlay.classList.remove("show");
  startOverlay.classList.add("show");
  btnPlay.textContent = "▶";

  render();
  library.classList.add("hidden");
  reader.classList.add("active");
  window.scrollTo(0, 0);
}

function goHome() {
  playing = false;
  clearTimeout(advanceTimer);
  cancelAutoNext();
  audio.pause();
  btnPlay.textContent = "▶";
  reader.classList.remove("active");
  library.classList.remove("hidden");
  location.hash = "";
}

/* ---------- Player ---------- */
function render() {
  const s = SLIDES[cur];
  img.src = base + "/" + s.image;
  caption.textContent = s.text;
  caption.scrollTop = 0;
  pageNum.textContent = (cur === 0 ? "Bìa" : "Trang " + cur) + " / " + (SLIDES.length - 1);
  [...dots.children].forEach((d, i) => {
    d.className = i < cur ? "done" : i === cur ? "cur" : "";
  });
  if (cur + 1 < SLIDES.length) { (new Image()).src = base + "/" + SLIDES[cur + 1].image; }
}

function playCurrent() {
  clearTimeout(advanceTimer);
  audio.src = base + "/" + SLIDES[cur].audio;
  audio.play().catch(() => {});
  btnPlay.textContent = "⏸";
}

function stopAudio() {
  clearTimeout(advanceTimer);
  audio.pause();
  btnPlay.textContent = "▶";
}

function go(i, manual) {
  if (i < 0 || i >= SLIDES.length) return;
  cancelAutoNext();
  cur = i;
  endOverlay.classList.remove("show");
  render();
  if (playing || manual) playCurrent();
}

audio.addEventListener("ended", () => {
  if (!playing) { btnPlay.textContent = "▶"; return; }
  if (cur + 1 < SLIDES.length) {
    advanceTimer = setTimeout(() => go(cur + 1), AUTO_ADVANCE_DELAY);
  } else {
    playing = false;
    btnPlay.textContent = "▶";
    endOverlay.classList.add("show");
    startAutoNext();
  }
});

/* ---------- Controls ---------- */
document.getElementById("btnStart").addEventListener("click", () => {
  startOverlay.classList.remove("show");
  playing = true;
  go(0);
});
document.getElementById("btnAgain").addEventListener("click", () => { playing = true; go(0); });
document.getElementById("btnLibrary").addEventListener("click", goHome);
document.getElementById("btnHome").addEventListener("click", goHome);
document.getElementById("btnNextStory").addEventListener("click", goNextStory);
document.getElementById("btnPrev").addEventListener("click", () => go(cur - 1, true));
document.getElementById("btnNext").addEventListener("click", () => go(cur + 1, true));
document.getElementById("tapPrev").addEventListener("click", () => go(cur - 1, true));
document.getElementById("tapNext").addEventListener("click", () => go(cur + 1, true));
document.getElementById("btnReplay").addEventListener("click", playCurrent);
document.getElementById("btnCaption").addEventListener("click", () => reader.classList.toggle("show-caption"));

btnPlay.addEventListener("click", () => {
  if (audio.paused) {
    playing = true;
    if (audio.src && !audio.ended) { audio.play(); btnPlay.textContent = "⏸"; }
    else playCurrent();
  } else {
    playing = false;
    stopAudio();
  }
});

document.addEventListener("keydown", (e) => {
  if (!reader.classList.contains("active")) return;
  if (e.key === "ArrowRight") go(cur + 1, true);
  else if (e.key === "ArrowLeft") go(cur - 1, true);
  else if (e.key === " ") { e.preventDefault(); btnPlay.click(); }
  else if (e.key === "Escape") goHome();
});

/* ---------- Deep link: index.html#story=3 ---------- */
function applyHash() {
  const m = (location.hash || "").match(/story=(\d+)/);
  if (m) {
    const idx = STORIES.findIndex(s => s.n === parseInt(m[1], 10));
    if (idx >= 0) openStory(idx);
  }
}
applyHash();
</script>
</body>
</html>
