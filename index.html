<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Truyện Shopee & Robocar Poli</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:#1a1423; color:#fff7ea; }
  body { overflow:hidden; }

  /* ============ LIBRARY ============ */
  #library { position:fixed; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:linear-gradient(160deg,#1a1423 0%,#241a36 50%,#1a2740 100%); padding:26px 16px 56px; }
  #library.hidden { display:none; }
  .lib-head { text-align:center; margin-bottom:24px; }
  .lib-head h1 { font-size:clamp(21px,5vw,32px); font-weight:800; }
  .lib-head p { margin-top:7px; color:#c9bfe0; font-size:clamp(13px,2.4vw,15px); }
  .grid { max-width:1080px; margin:0 auto; display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
  .card { cursor:pointer; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    border-radius:16px; overflow:hidden; display:flex; flex-direction:column;
    transition:transform .18s, box-shadow .18s, background .18s; }
  .card:hover,.card:active { transform:translateY(-4px); background:rgba(255,255,255,.09);
    box-shadow:0 12px 32px rgba(0,0,0,.45); }
  .thumb { position:relative; aspect-ratio:5/7; background:#0e0a17; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .num { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.6); backdrop-filter:blur(4px);
    font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; }
  .cap { padding:11px 12px; font-size:13.5px; line-height:1.4; font-weight:600; flex:1; }

  /* ============ READER ============ */
  #reader { position:fixed; inset:0; display:none; background:#1a1423; }
  #reader.active { display:block; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px;
    box-shadow:0 8px 40px rgba(0,0,0,.6); animation:fadeIn .6s ease; }
  @keyframes fadeIn { from{opacity:0;transform:scale(.985);} to{opacity:1;transform:scale(1);} }

  .tapzone { position:fixed; top:0; bottom:120px; width:28%; z-index:5; cursor:pointer; }
  #tapPrev { left:0; } #tapNext { right:0; }

  #caption { position:fixed; left:50%; transform:translateX(-50%); bottom:86px;
    max-width:min(92vw,700px); max-height:32vh; overflow-y:auto;
    background:rgba(20,14,30,.82); backdrop-filter:blur(8px); color:#fff7ea;
    font-size:clamp(15px,2.2vmin,19px); line-height:1.55; padding:14px 18px; border-radius:14px;
    z-index:6; display:none; white-space:pre-wrap; }
  #reader.show-caption #caption { display:block; }

  /* top-left back button */
  #btnHome { position:fixed; top:12px; left:12px; z-index:11; border:none; border-radius:999px;
    background:rgba(0,0,0,.55); backdrop-filter:blur(6px); color:#fff; font-size:14px; font-weight:600;
    padding:9px 16px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  #btnHome:active { transform:scale(.94); }

  #bar { position:fixed; left:0; right:0; bottom:0; height:76px; z-index:10;
    display:flex; align-items:center; justify-content:center; gap:14px;
    background:linear-gradient(transparent, rgba(10,6,16,.85) 40%); }
  #bar button { border:none; border-radius:50%; width:48px; height:48px; background:rgba(255,255,255,.12);
    color:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s, transform .1s; }
  #bar button:active { transform:scale(.92); }
  #bar button:hover { background:rgba(255,255,255,.25); }
  #btnPlay { width:60px !important; height:60px !important; font-size:26px !important; background:#ff7a2f !important; }
  #pageNum { color:#ffd9b3; font-size:15px; min-width:64px; text-align:center; font-variant-numeric:tabular-nums; }

  #dots { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:7px; z-index:10;
    max-width:70vw; flex-wrap:wrap; justify-content:center; }
  #dots span { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.25); cursor:pointer; transition:all .2s; }
  #dots span.done { background:rgba(255,170,90,.55); }
  #dots span.cur { background:#ff7a2f; transform:scale(1.35); }

  .overlay { position:fixed; inset:0; z-index:50; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:24px; text-align:center; padding:24px; }
  .overlay.show { display:flex; }
  #startOverlay { background:radial-gradient(ellipse at center,#3b2a55 0%,#1a1423 75%); }
  #startOverlay h1 { color:#ffe9cf; font-size:clamp(22px,4.5vmin,36px); max-width:80vw; line-height:1.3; text-shadow:0 3px 16px rgba(0,0,0,.5); }
  #startOverlay .sub { color:#bda8d8; font-size:clamp(14px,2.2vmin,18px); }
  #startCover { width:min(38vh,68vw); border-radius:12px; box-shadow:0 10px 50px rgba(0,0,0,.7); }
  .bigbtn { border:none; background:linear-gradient(135deg,#ff8c42,#ff5e3a); color:#fff;
    font-size:clamp(17px,3vmin,22px); font-weight:700; padding:15px 40px; border-radius:999px;
    cursor:pointer; box-shadow:0 6px 26px rgba(255,110,60,.45); transition:transform .12s; }
  .bigbtn:active { transform:scale(.95); }
  #endOverlay { background:rgba(18,12,28,.92); backdrop-filter:blur(6px); }
  #endOverlay h2 { color:#ffe9cf; font-size:clamp(22px,4vmin,32px); }
  .end-row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .end-row .bigbtn.alt { background:rgba(255,255,255,.14); box-shadow:none; }
  .toggle { display:flex; align-items:center; gap:10px; cursor:pointer; color:#e8dcff;
    font-size:clamp(14px,2.2vmin,17px); font-weight:600; user-select:none; }
  .toggle input { position:absolute; opacity:0; width:0; height:0; }
  .toggle .slider { position:relative; width:48px; height:27px; border-radius:999px; flex:none;
    background:rgba(255,255,255,.22); transition:background .2s; }
  .toggle .slider::before { content:""; position:absolute; top:3px; left:3px; width:21px; height:21px;
    border-radius:50%; background:#fff; transition:transform .2s; }
  .toggle input:checked + .slider { background:#ff7a2f; }
  .toggle input:checked + .slider::before { transform:translateX(21px); }
  #autoNextCountdown { color:#ffd9b3; font-size:clamp(14px,2.4vmin,18px); min-height:1.5em;
    font-weight:600; text-align:center; }
</style>
</head>
<body>

<!-- ============ LIBRARY VIEW ============ -->
<div id="library">
  <div class="lib-head">
    <h1>📚 Truyện Shopee &amp; Robocar Poli</h1>
    <p>Chạm vào một truyện để nghe kể chuyện &amp; xem hình</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- ============ READER VIEW ============ -->
<div id="reader" class="show-caption">
  <div id="stage"><img id="slideImg" alt="trang truyện"></div>
  <div id="tapPrev" class="tapzone"></div>
  <div id="tapNext" class="tapzone"></div>
  <div id="caption"></div>
  <div id="dots"></div>
  <button id="btnHome">‹ Thư viện</button>
  <div id="bar">
    <button id="btnPrev" title="Trang trước">⏮</button>
    <button id="btnPlay" title="Phát / Dừng">▶</button>
    <button id="btnNext" title="Trang sau">⏭</button>
    <span id="pageNum"></span>
    <button id="btnReplay" title="Đọc lại trang này">🔁</button>
    <button id="btnCaption" title="Ẩn / hiện chữ">Aa</button>
  </div>

  <div id="startOverlay" class="overlay">
    <img id="startCover" alt="bìa truyện">
    <h1 id="startTitle"></h1>
    <div class="sub" id="startSub"></div>
    <button id="btnStart" class="bigbtn">▶ &nbsp;Bắt đầu đọc truyện</button>
  </div>

  <div id="endOverlay" class="overlay">
    <h2>🎉 Hết truyện rồi! Bé giỏi lắm!</h2>
    <label class="toggle"><input type="checkbox" id="chkAutoNext"><span class="slider"></span><span>Tự động mở truyện tiếp theo</span></label>
    <div id="autoNextCountdown"></div>
    <div class="end-row">
      <button id="btnAgain" class="bigbtn">📖 Đọc lại</button>
      <button id="btnNextStory" class="bigbtn">➡️ Truyện tiếp theo</button>
      <button id="btnLibrary" class="bigbtn alt">📚 Chọn truyện khác</button>
    </div>
  </div>
</div>

<script>
const STORIES = [{"n":1,"title":"Shopee bình tĩnh tìm mẹ","base":"Shopee-story-1","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee bình tĩnh tìm mẹ. Bài học hôm nay: kỹ năng xử lý khi bị lạc nơi công cộng."},{"image":"page1.png","audio":"audio/01.mp3","text":"Cuối tuần, bé Shopee được mẹ cho đi siêu thị. Hai mẹ con nắm tay nhau, vui vẻ đi dạo qua những gian hàng đầy màu sắc."},{"image":"page2.png","audio":"audio/02.mp3","text":"Đi ngang gian đồ chơi rực rỡ, Shopee mải mê ngắm nhìn những món đồ chơi xinh xắn. Bé vô tình buông tay mẹ ra mà không hề hay biết."},{"image":"page3.png","audio":"audio/03.mp3","text":"Khi quay lại, Shopee không thấy mẹ đâu nữa. Xung quanh bé chỉ toàn người lạ đang đi lại hối hả. Bé chợt thấy lo lắng vô cùng."},{"image":"page4.png","audio":"audio/04.mp3","text":"Nhưng rồi Shopee chợt nhớ lời chị Jin đã dặn. Chị Jin từng nói: Nếu bị lạc, em không được chạy lung tung nhé!"},{"image":"page5.png","audio":"audio/05.mp3","text":"Thế là Shopee đứng yên tại chỗ, hít một hơi thật sâu để không bật khóc. Bé bình tĩnh quan sát xung quanh, và nhìn thấy một cô nhân viên siêu thị mặc bộ đồng phục màu xanh rất dễ nhận ra."},{"image":"page6.png","audio":"audio/06.mp3","text":"Bé Shopee đi đến bên cô nhân viên, khoanh tay lễ phép thưa: Cô ơi, con bị lạc mẹ ạ. Cô giúp con thông báo tìm mẹ với ạ! Cô nhân viên dịu dàng đáp: Shopee ngoan quá, con thật bình tĩnh. Để cô giúp con nhé!"},{"image":"page7.png","audio":"audio/07.mp3","text":"Chỉ một lát sau, tiếng loa phát thanh trong siêu thị vang lên, thông báo tìm người thân cho Shopee. Bé đứng cạnh cô nhân viên, lòng đã thấy yên tâm hơn nhiều."},{"image":"page8.png","audio":"audio/08.mp3","text":"Từ phía xa, mẹ, chị Jin cùng xe cảnh sát Poli vội vã chạy đến. Ai cũng mừng rỡ khi nhìn thấy Shopee vẫn an toàn."},{"image":"page9.png","audio":"audio/09.mp3","text":"Chị Jin reo lên: Hoan hô Shopee! Em đã làm rất đúng. Khi bị lạc, đứng yên và nhờ người mặc đồng phục giúp đỡ là cách an toàn nhất! Poli khen ngợi: Shopee của chúng ta thật bản lĩnh, xứng đáng là thành viên nhí xuất sắc của đội cứu hộ! Poli nháy đèn xanh đỏ vui vẻ, còn mẹ thì ôm Shopee vào lòng, mỉm cười hạnh phúc."},{"image":"page10.png","audio":"audio/10.mp3","text":"Bài học cho bé: Khi bị lạc ở nơi đông người, bé hãy đứng yên tại chỗ, không đi theo người lạ, và tìm các cô chú mặc đồng phục như nhân viên hoặc bảo vệ để nhờ giúp đỡ nhé!"}]},{"n":2,"title":"Cùng đọc sách với chị Jin và Helly","base":"Shopee-story-2","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Cùng đọc sách với chị Jin và Helly. Bài học hôm nay: xin phép trước khi mượn đồ hoặc tham gia cùng người khác."},{"image":"page1.png","audio":"audio/01.mp3","text":"Một buổi chiều yên tĩnh tại trạm cứu hộ, chị Jin và máy bay trực thăng Helly đang cùng nhau say sưa đọc một cuốn sách tranh rất lớn về những bầu trời xanh."},{"image":"page2.png","audio":"audio/02.mp3","text":"Bé Shopee thấy hình ảnh những đám mây đẹp quá, liền chạy tới, định cầm lấy trang sách để xem."},{"image":"page3.png","audio":"audio/03.mp3","text":"Chị Jin nhẹ nhàng giữ tay Shopee lại và mỉm cười, dặn: Shopee ơi, đợi một chút nào! Chị và anh Helly đang cùng đọc sách. Trước khi muốn cùng xem hoặc mượn đồ của người khác, em cần phải làm gì nhỉ?"},{"image":"page4.png","audio":"audio/04.mp3","text":"Bé Shopee gãi đầu ngượng ngùng, đáp: Dạ... em quên mất ạ. Em phải xin phép đúng không chị?"},{"image":"page5.png","audio":"audio/05.mp3","text":"Bé Shopee bèn đứng lại ngay ngắn, khoanh tay và nhìn chị Jin cùng Helly lễ phép hỏi: Chị Jin và anh Helly ơi, cho em ngồi đọc sách cùng với mọi người được không ạ?"},{"image":"page6.png","audio":"audio/06.mp3","text":"Helly xoay cánh quạt nhè nhẹ, hào hứng đáp: Tất nhiên rồi! Mời Shopee ngồi vào giữa nhé, cuốn sách này có nhiều hình máy bay đẹp lắm!"},{"image":"page7.png","audio":"audio/07.mp3","text":"Chị Jin khen Shopee vì bé đã biết nhận lỗi và sửa lỗi ngay lập tức. Cả ba cùng nhau ngồi đọc sách thật vui vẻ và ấm áp."},{"image":"page8.png","audio":"audio/08.mp3","text":"Bài học cho bé. Khi muốn dùng đồ chơi hoặc tham gia chơi cùng ai đó, bé hãy nhớ ba điều. Một, khoanh tay lễ phép hỏi mượn hoặc xin phép. Hai, khi được mọi người đồng ý thì cùng nhau chia sẻ thật vui. Ba, luôn mỉm cười nói lời cảm ơn. Khi được mọi người đồng ý, niềm vui sẽ nhân lên gấp bội đấy!"}]},{"n":3,"title":"Shopee và Đội cứu hộ giải cứu chung cư","base":"Shopee-story-3","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee và Đội cứu hộ giải cứu chung cư. Bài học hôm nay: kỹ năng thoát hiểm khi có hỏa hoạn."},{"image":"page1.png","audio":"audio/01.mp3","text":"Đêm đã khuya, tại căn hộ chung cư, bé Shopee cùng bố mẹ đang chìm trong giấc ngủ ngon. Chợt có tiếng chuông báo cháy vang lên dồn dập ngoài hành lang: reng... reng... reng!"},{"image":"page2.png","audio":"audio/02.mp3","text":"Ngay lập tức, tại trụ sở cứu hộ, chị Jin nhận được tín hiệu báo động. Chị nhanh chóng điều động đội hình. Chị Jin gọi lớn: Đội xe cứu hộ chú ý! Có hỏa hoạn tại chung cư của bé Shopee. Roy, Poli, Amber, Helly, xuất kích ngay lập tức!"},{"image":"page3.png","audio":"audio/03.mp3","text":"Tại căn hộ, bố mẹ Shopee giật mình thức dậy. Nhớ lời chị Jin đã dạy trước đó, bé Shopee không hoảng sợ hay khóc lóc. Bé cùng bố mẹ bình tĩnh thực hiện đúng các bước an toàn."},{"image":"page4.png","audio":"audio/04.mp3","text":"Bố nhanh tay lấy khăn ướt đưa cho mẹ và Shopee để che kín mũi và miệng, tránh hít phải khói."},{"image":"page5.png","audio":"audio/05.mp3","text":"Mẹ nhắc Shopee cúi thấp người xuống để tránh khói. Bé Shopee đáp ngay: Dạ, con nhớ rồi! Phải đi khom lưng và không được dùng thang máy ạ! Thế là cả gia đình cùng nhau di chuyển theo lối cầu thang bộ thoát hiểm. Đúng lúc đó, đội cứu hộ cũng vừa ập đến."},{"image":"page6.png","audio":"audio/06.mp3","text":"Helly bay trên cao, dùng đèn pha rọi sáng toàn bộ tòa nhà và thông báo: Mọi người bình tĩnh, đi theo lối thoát hiểm, đội cứu hộ đã đến rồi! Phía dưới đường, Poli dùng còi hú để phân luồng giao thông, giúp các xe khác nhường đường cho xe cứu hỏa."},{"image":"page7.png","audio":"audio/07.mp3","text":"Roy vươn chiếc thang dài lên cao, phun những vòi nước mạnh mẽ để dập tắt đám cháy. Còn Amber thì mở sẵn cửa xe, chuẩn bị túi cứu thương và nước ấm để chăm sóc mọi người."},{"image":"page8.png","audio":"audio/08.mp3","text":"Khi gia đình Shopee ra đến sân an toàn, chị Jin và Amber chạy lại kiểm tra sức khỏe cho bé. Chị Jin khen: Shopee giỏi lắm! Em đã rất bình tĩnh, biết che mũi và đi thang bộ."},{"image":"page9.png","audio":"audio/09.mp3","text":"Poli và Roy cùng reo lên: Hoan hô bé Shopee bản lĩnh! Em đúng là một người bạn nhỏ thông minh của đội xe cứu hộ! Bé Shopee ôm chặt bố mẹ và vẫy tay chào các bạn xe cứu hộ. Bé đã học được rằng, chỉ cần bình tĩnh và làm theo hướng dẫn, mọi chuyện sẽ ổn thôi!"},{"image":"page10.png","audio":"audio/10.mp3","text":"Khi có hỏa hoạn, bé nhớ nhé! Một, hãy thật bình tĩnh, đừng hoảng sợ. Hai, dùng khăn ướt che mũi và miệng. Ba, cúi thấp người xuống để tránh khói. Bốn, đi theo lối cầu thang bộ thoát hiểm, và tuyệt đối không dùng thang máy nhé!"}]},{"n":4,"title":"Shopee sang đường cùng bạn Poli","base":"Shopee-story-4","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee sang đường cùng bạn Poli. Bài học hôm nay: an toàn giao thông cho người đi bộ nhé các bé!"},{"image":"page1.png","audio":"audio/01.mp3","text":"Chiều nay, mẹ đến trường đón bé Shopee tan học. Hai mẹ con nắm tay nhau bước ra khỏi cổng trường, ánh nắng chiều vàng dịu trải khắp con đường."},{"image":"page2.png","audio":"audio/02.mp3","text":"Vừa ra tới vỉa hè, Shopee bỗng reo lên vui sướng vì nhìn thấy chị Jin, người quản lý đội cứu hộ, đang đứng ở bên kia đường để kiểm tra thiết bị. Shopee thích thú gọi to: A! Chị Jin kìa! Chị Jin ơi!"},{"image":"page3.png","audio":"audio/03.mp3","text":"Phấn khích quá, Shopee định buông tay mẹ để chạy thật nhanh sang bên kia đường với chị. Đúng lúc đó, xe cảnh sát Poli đang tuần tra gần đó liền tiến lại, nháy đèn xanh đỏ báo hiệu. Poli vội kêu lên: Kéttt... Shopee ơi, dừng lại một chút nào! Sang đường như vậy là rất nguy hiểm đấy. Mẹ cũng nắm chặt tay Shopee và nhẹ nhàng nhắc: Đúng rồi Shopee ạ. Xe cộ đang đi lại rất đông, con không được tự ý chạy sang đường như thế."},{"image":"page4.png","audio":"audio/04.mp3","text":"Chị Jin từ bên kia đường vẫy tay ra hiệu cho Shopee hãy chờ đợi. Poli ân cần hướng dẫn bé: Để sang đường an toàn, Shopee phải nhớ quy tắc ba bước nhé. Một là nắm chặt tay người lớn. Hai là tìm đúng vạch kẻ đường dành cho người đi bộ. Ba là quan sát đèn tín hiệu. Khi đèn xanh cho người đi bộ bật lên và các xe đã dừng hẳn, mình mới được bước đi."},{"image":"page5.png","audio":"audio/05.mp3","text":"Bé Shopee ngoan ngoãn gật đầu và đáp: Dạ, em nhớ rồi anh Poli ạ! Rồi bé nắm tay mẹ thật chặt bằng cả hai bàn tay nhỏ xíu."},{"image":"page6.png","audio":"audio/06.mp3","text":"Hai mẹ con cùng đứng ngay ngắn trước vạch kẻ đường, kiên nhẫn chờ đèn tín hiệu chuyển sang màu xanh. Đèn dành cho người đi bộ vẫn đang đỏ, xe cộ phía trước vẫn chạy qua lại."},{"image":"page7.png","audio":"audio/07.mp3","text":"Khi đèn xanh bật lên và các xe đã dừng lại trước vạch dừng, mẹ và Shopee mới dắt tay nhau bước đi trên vạch trắng dành cho người đi bộ. Shopee bước những bước thật cẩn thận, mẹ mỉm cười đi bên cạnh."},{"image":"page8.png","audio":"audio/08.mp3","text":"Sang tới vỉa hè bên kia, chị Jin mỉm cười dang tay đón Shopee. Chị khen: Chào bé Shopee! Em giỏi lắm, đi bộ sang đường đúng quy định mới là bé ngoan."},{"image":"page9.png","audio":"audio/09.mp3","text":"Poli vui vẻ bóp còi tạm biệt: Píp píp! Chúc Shopee và mẹ về nhà an toàn nhé! Bé Shopee vẫy tay chào tạm biệt anh Poli, rồi cùng mẹ và chị Jin đi về nhà. Trong lòng bé thầm hứa sẽ luôn chú ý an toàn giao thông."},{"image":"page10.png","audio":"audio/10.mp3","text":"Sang đường an toàn, bé nhớ nhé! Một, luôn nắm chặt tay người lớn khi đi trên đường. Hai, chỉ sang đường ở nơi có vạch kẻ dành cho người đi bộ. Ba, quan sát đèn tín hiệu và chỉ đi khi đèn xanh cho người đi bộ bật lên. Bốn, tuyệt đối không chạy nhảy hoặc đột ngột lao ra đường."}]},{"n":5,"title":"Shopee và chiếc xe ăn trộm Poacher","base":"Shopee-story-5","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee và chiếc xe ăn trộm Poacher. Bài học hôm nay: không đi theo người lạ, biết bảo vệ đồ cá nhân, và nhờ người lớn giúp đỡ khi gặp nguy hiểm."},{"image":"page1.png","audio":"audio/01.mp3","text":"Một buổi sáng đẹp trời, bé Shopee được bố mẹ đưa đến khu cắm trại gần chân núi. Hôm nay, đội cứu hộ cũng có mặt để tổ chức một buổi trải nghiệm an toàn ngoài trời cho các bạn nhỏ."},{"image":"page2.png","audio":"audio/02.mp3","text":"Ở bãi cỏ rộng, chị Jin đang hướng dẫn các bé cách xếp ba lô, giữ đồ cá nhân và không tự ý đi xa khỏi khu vực cắm trại. Bên cạnh chị là hai người bạn xe địa hình rất khỏe mạnh: Mountain Car Mark và Bucky. Mark có thân xe chắc chắn, bánh xe lớn, chuyên leo dốc và vượt đường núi. Bucky nhỏ hơn một chút nhưng rất nhanh nhẹn, giỏi chở đồ và tìm đường trong rừng. Chị Jin dặn: \"Các em nhớ nhé! Khi đi chơi nơi đông người hoặc nơi xa lạ, mình phải luôn ở gần bố mẹ, không đi theo người lạ và không để ba lô, đồ chơi lung tung.\" Bé Shopee ngoan ngoãn gật đầu: \"Dạ, em nhớ rồi ạ!\""},{"image":"page3.png","audio":"audio/03.mp3","text":"Sau giờ học kỹ năng, Shopee đặt chiếc ba lô nhỏ của mình bên cạnh lều. Trong ba lô có bình nước, áo khoác và một chiếc xe đồ chơi mà bé rất thích."},{"image":"page4.png","audio":"audio/04.mp3","text":"Đúng lúc đó, từ sau bụi cây gần bãi cắm trại, một chiếc xe lạ lén lút xuất hiện. Đó là Poacher, chiếc xe ăn trộm chuyên rình lúc mọi người không chú ý để lấy đồ. Nhìn thấy ba lô của Shopee, Poacher hí hửng: \"Ồ, một chiếc ba lô xinh xắn! Chắc bên trong có nhiều thứ hay ho lắm đây!\" Rồi Poacher nhẹ nhàng nâng thân xe lên, dùng chiếc càng nhỏ kẹp lấy ba lô, định lùi thật nhanh vào con đường mòn sau rừng."},{"image":"page5.png","audio":"audio/05.mp3","text":"May mắn thay, Bucky đang đứng gần đó đã phát hiện ra. Bucky vội kêu lên: \"Mark ơi! Có xe lạ đang lấy ba lô của Shopee!\" Mountain Car Mark lập tức quay đầu lại, bật đèn pha sáng lên: \"Poacher, dừng lại ngay! Đó không phải đồ của cậu!\""},{"image":"page6.png","audio":"audio/06.mp3","text":"Nghe tiếng Mark, Shopee quay lại và giật mình khi thấy ba lô của mình đang bị Poacher kéo đi. Bé hơi lo lắng, nhưng bé nhớ lời chị Jin vừa dặn: không tự ý chạy theo người lạ, và không tự mình đuổi theo kẻ xấu."},{"image":"page7.png","audio":"audio/07.mp3","text":"Shopee liền chạy đến bên chị Jin và nói rõ ràng: \"Chị Jin ơi, xe Poacher đang lấy ba lô của em ạ!\" Chị Jin lập tức giữ Shopee đứng lại bên cạnh mình: \"Shopee làm đúng lắm! Khi gặp nguy hiểm, em không được tự chạy theo. Hãy báo ngay cho người lớn hoặc đội cứu hộ.\""},{"image":"page8.png","audio":"audio/08.mp3","text":"Ngay sau đó, chị Jin gọi đội hỗ trợ: \"Mark, Bucky, hãy chặn lối ra đường núi! Poli, đến hỗ trợ ngay!\" Mark phóng nhanh đến con đường mòn, dùng thân xe chắc chắn chặn lối thoát. Bucky nhanh nhẹn chạy vòng sang bên hông, không cho Poacher rẽ vào rừng. Poacher hốt hoảng: \"Tránh ra nào! Ta chỉ mượn một chút thôi mà!\" Bucky đáp: \"Mượn đồ thì phải xin phép. Lấy trộm là không đúng!\" Đúng lúc đó, Poli xuất hiện từ phía cổng khu cắm trại, đèn xanh đỏ nhấp nháy, còi xe vang lên nghiêm nghị: \"Poacher, dừng lại! Trả lại ba lô cho Shopee ngay!\""},{"image":"page9.png","audio":"audio/09.mp3","text":"Bị Mark, Bucky và Poli chặn cả ba hướng, Poacher không thể chạy thoát, đành đặt ba lô xuống: \"Được rồi... ta trả lại. Ta biết lỗi rồi.\" Bucky nhẹ nhàng đẩy chiếc ba lô về phía Shopee. Chị Jin kiểm tra lại bên trong: bình nước, áo khoác và chiếc xe đồ chơi vẫn còn nguyên. Poacher cúi đầu xấu hổ, lí nhí xin lỗi: \"Shopee ơi, cho tôi xin lỗi. Tôi sẽ không lấy đồ của người khác nữa.\" Shopee lễ phép đáp: \"Không sao ạ, nhưng lần sau chú phải xin phép trước nhé!\""},{"image":"page10.png","audio":"audio/10.mp3","text":"Shopee ôm ba lô vào lòng, thở phào nhẹ nhõm: \"May quá! Cảm ơn chị Jin, anh Mark, anh Bucky và anh Poli ạ!\" Mark mỉm cười hiền hậu: \"Shopee rất giỏi vì đã không tự mình đuổi theo Poacher.\" Bucky vui vẻ nói thêm: \"Đúng rồi! Khi thấy người lạ lấy đồ hoặc rủ mình đi đâu đó, bé phải báo ngay cho người lớn.\" Poli nháy đèn xanh đỏ: \"Và nhớ giữ đồ cá nhân ở gần mình nhé!\" Chị Jin xoa đầu Shopee: \"Hôm nay Shopee đã học được một bài học rất quan trọng: bình tĩnh, không chạy theo người xấu, và biết nhờ người lớn giúp đỡ.\" Cả đội cùng bật cười vui vẻ. Buổi cắm trại lại trở nên an toàn và rộn ràng."},{"image":"page11.png","audio":"audio/11.mp3","text":"Bài học cho bé. Khi đi chơi ở nơi công cộng hoặc nơi xa lạ, bé hãy nhớ: Một, luôn ở gần bố mẹ hoặc người lớn đi cùng. Hai, không đi theo người lạ, dù họ nói gì hoặc cho quà gì. Ba, giữ ba lô, đồ chơi và vật cá nhân ở gần mình. Bốn, nếu thấy ai lấy đồ hoặc gặp nguy hiểm, bé không tự chạy theo, mà hãy báo ngay cho người lớn hoặc đội cứu hộ nhé!"}]},{"n":6,"title":"Shopee và bữa cơm nhiều màu sắc","base":"Shopee-story-6","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee và bữa cơm nhiều màu sắc. Bài học hôm nay: ăn đủ chất — đủ cơm, đủ thịt, đủ rau — và ăn uống sạch sẽ, gọn gàng."},{"image":"page1.png","audio":"audio/01.mp3","text":"Chiều nay, mẹ nấu một bữa cơm thật ngon. Trên bàn có cơm trắng, thịt kho mềm thơm, canh rau xanh mát và một đĩa cà rốt xào vàng óng."},{"image":"page2.png","audio":"audio/02.mp3","text":"Shopee vừa nhìn thấy đĩa thịt đã reo lên: \"Ôi, thịt kho! Con thích món này nhất!\" Bé nhanh tay gắp ngay một miếng thịt to bỏ vào bát. Rồi miếng thứ hai, miếng thứ ba. Còn rau xanh thì bé đẩy sang một bên. Mẹ nhìn thấy liền nhẹ nhàng hỏi: \"Shopee ơi, sao con không ăn rau?\" Shopee lắc đầu: \"Rau không ngon bằng thịt đâu mẹ. Con chỉ muốn ăn thịt thôi!\""},{"image":"page3.png","audio":"audio/03.mp3","text":"Đúng lúc đó, chị Jin và chị Amber ghé qua nhà Shopee. Chị Amber là xe cứu thương robot màu hồng trắng của đội cứu hộ. Chị rất dịu dàng và luôn biết cách chăm sóc mọi người."},{"image":"page4.png","audio":"audio/04.mp3","text":"Chị Amber nhìn bát cơm của Shopee rồi mỉm cười: \"Shopee à, cơ thể của em cũng giống như một chiếc xe cứu hộ vậy. Muốn chạy khỏe thì cần đủ nhiều loại năng lượng.\" Shopee tò mò hỏi: \"Thịt là năng lượng đúng không chị Amber?\" Chị Amber gật đầu: \"Đúng rồi. Thịt giúp em có sức mạnh. Nhưng rau cũng rất quan trọng. Rau giúp bụng em dễ chịu, giúp em khỏe hơn và không bị táo bón.\""},{"image":"page5.png","audio":"audio/05.mp3","text":"Chị Jin ngồi xuống cạnh Shopee, chỉ vào bát cơm: \"Con nhìn này. Bữa cơm đủ màu sắc mới là bữa cơm tốt. Có cơm, có thịt, có rau. Ăn đủ thì con mới cao lớn, chạy nhanh và chơi vui được.\" Shopee nhìn lại bát của mình. Bé thấy bát chỉ toàn thịt, còn rau vẫn nằm yên trên đĩa. Bé hơi ngượng: \"Vậy nếu con chỉ ăn thịt thì không tốt ạ?\" Mẹ xoa đầu Shopee: \"Đúng rồi con. Thịt rất ngon, nhưng ăn quá nhiều thịt mà không ăn rau thì bụng dễ khó chịu. Mình cần ăn cân bằng.\""},{"image":"page6.png","audio":"audio/06.mp3","text":"Shopee gật gù: \"Vậy con sẽ thử ăn một miếng rau nhỏ.\" Bé gắp một cọng rau xanh, nhai chậm rãi. Ban đầu Shopee hơi nhăn mặt, nhưng sau đó bé cười: \"Ơ, cũng không khó ăn lắm mẹ ạ!\" Mẹ vui vẻ nói: \"Giỏi quá! Con cứ ăn từng chút một. Không cần ăn thật nhiều ngay, nhưng phải tập ăn đủ.\""},{"image":"page7.png","audio":"audio/07.mp3","text":"Một lát sau, Shopee vừa ăn thịt, vừa ăn rau, vừa ăn cơm. Nhưng vì vui quá, bé làm rơi vài hạt cơm xuống bàn, rồi lấy tay dính mỡ chạm vào áo. Chị Jin nhẹ nhàng nhắc: \"Shopee ơi, khi ăn cơm mình cũng cần ăn sạch sẽ nhé.\" Shopee nhìn xuống áo: \"Ôi, áo con bẩn rồi!\""},{"image":"page8.png","audio":"audio/08.mp3","text":"Chị Amber đưa cho Shopee một chiếc khăn nhỏ: \"Khi ăn, em nhớ ngồi ngay ngắn, nhai từ từ, không nghịch đồ ăn, không làm rơi vãi. Nếu tay bẩn thì em lau tay hoặc nhờ mẹ lấy khăn nhé.\" Shopee cầm khăn lau tay rồi nói: \"Em hiểu rồi ạ. Ăn ngoan là phải ăn đủ thịt, đủ rau và ăn sạch sẽ.\" Mẹ mỉm cười: \"Đúng rồi. Hôm nay Shopee rất tiến bộ.\""},{"image":"page9.png","audio":"audio/09.mp3","text":"Sau bữa cơm, Shopee nhìn chiếc bát sạch của mình, vui vẻ khoe: \"Mẹ ơi, con ăn hết cả thịt và rau rồi!\" Chị Jin giơ ngón tay cái: \"Shopee hôm nay ăn rất giỏi!\" Chị Amber cũng vui vẻ nói: \"Một bữa cơm sạch sẽ và đủ chất sẽ giúp em khỏe mạnh như một bạn nhỏ cứu hộ!\" Shopee cười thật tươi: \"Từ nay con sẽ ăn cả thịt, cả rau, và không làm rơi vãi nữa ạ!\""},{"image":"page10.png","audio":"audio/10.mp3","text":"Bài học cho bé. Trong bữa cơm, bé không nên chỉ ăn món mình thích. Bé cần ăn đủ cơm, thịt, cá, trứng và rau để cơ thể khỏe mạnh, cao lớn và có nhiều năng lượng. Khi ăn, bé nhớ ngồi ngay ngắn, nhai từ từ, không nghịch đồ ăn, không làm rơi vãi và giữ tay áo sạch sẽ. Bé ăn đủ chất và sạch sẽ là bé rất ngoan."}]},{"n":7,"title":"Shopee và bài học từ Spookey lười tắm","base":"Shopee-story-7","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee và bài học từ Spookey lười tắm. Bài học hôm nay: sau khi chơi đùa, ra mồ hôi hay bị bẩn, bé cần tắm rửa sạch sẽ, rửa tay và thay quần áo sạch để luôn khỏe mạnh, thơm tho."},{"image":"page1.png","audio":"audio/01.mp3","text":"Chiều hôm đó, bố mẹ đưa Shopee đến trạm cứu hộ chơi. Shopee rất háo hức vì được gặp các bạn trong đội Robocar: Poli, Amber, Helly và Roy. Vừa đến nơi, Shopee đã nghe thấy một tiếng \"bịch!\" rất to ở ngoài sân. \"Chuyện gì vậy ạ?\" Shopee hỏi. Bố nhìn ra ngoài rồi nói: \"Hình như có xe nào vừa trượt ngã kìa!\""},{"image":"page2.png","audio":"audio/02.mp3","text":"Cả nhà chạy ra sân. Ở đó, Spookey — chiếc xe nghịch ngợm hay bị bẩn — đang nằm nghiêng bên cạnh một vũng bùn. Trên thân xe của Spookey dính đầy đất, lá khô và những vệt bẩn đen sì. Spookey lúng túng nói: \"Ối… đau quá! Sao bánh xe của mình lại trơn thế nhỉ?\""},{"image":"page3.png","audio":"audio/03.mp3","text":"Poli chạy tới kiểm tra xung quanh: \"Spookey, em lại chạy nghịch qua vũng bùn phải không?\" Spookey cười ngượng: \"Em chỉ chạy một chút thôi mà.\" Helly bay vòng trên cao rồi nói: \"Nhưng người em bẩn quá rồi đó, Spookey! Từ trên này anh còn nhìn thấy cả bùn khô dính ở bánh xe nữa.\" Roy kéo Spookey đứng dậy, rồi nhíu mày: \"Bánh xe của em bị bùn bám dày quá. Nếu không rửa sạch, em rất dễ bị trượt ngã hoặc hỏng hóc.\""},{"image":"page4.png","audio":"audio/04.mp3","text":"Amber nhẹ nhàng tiến lại gần: \"Spookey, lần cuối em tắm rửa, vệ sinh sạch sẽ là khi nào?\" Spookey nhìn sang bên trái, rồi nhìn sang bên phải: \"Ờm… chắc là… lâu lắm rồi ạ.\" Shopee ngạc nhiên: \"Spookey không tắm ạ?\" Spookey bĩu môi: \"Tắm mất thời gian lắm! Em thích chơi hơn. Với lại bẩn một chút có sao đâu!\""},{"image":"page5.png","audio":"audio/05.mp3","text":"Mẹ Shopee nghe vậy liền dịu dàng nói: \"Bẩn một chút nếu được rửa ngay thì không sao. Nhưng nếu để lâu, bụi bẩn, mồ hôi và vi khuẩn sẽ làm cơ thể khó chịu đấy.\" Shopee tò mò hỏi: \"Vi khuẩn là gì hả mẹ?\" Mẹ giải thích: \"Vi khuẩn là những thứ rất nhỏ mà mắt mình không nhìn thấy được. Nếu mình lười tắm, lười rửa tay, vi khuẩn có thể bám trên người, làm mình bị ngứa, bị hôi, nổi mẩn hoặc dễ ốm hơn.\""},{"image":"page6.png","audio":"audio/06.mp3","text":"Spookey nghe đến đó thì giật mình: \"Thật ạ? Em tưởng chỉ hơi bẩn thôi chứ!\" Amber gật đầu: \"Với xe như em, bùn đất có thể làm bánh xe trơn, động cơ nóng, các khớp bị kẹt và dễ hỏng hơn. Còn với các bạn nhỏ như Shopee, nếu lười tắm thì cơ thể dễ có mùi hôi, ngứa ngáy và không khỏe.\" Shopee nghe xong liền nhớ ra tối qua mình cũng từng mè nheo không muốn tắm. Bé khẽ nói: \"Hôm qua con cũng bảo mẹ là con không muốn tắm…\" Bố mỉm cười hỏi: \"Vậy bây giờ con thấy tắm có quan trọng không?\" Shopee gật đầu: \"Có ạ. Tắm giúp người sạch sẽ, thơm tho và khỏe mạnh hơn.\""},{"image":"page7.png","audio":"audio/07.mp3","text":"Đúng lúc đó, Spookey đưa bánh xe lên gãi gãi vào thân mình: \"Ôi, sao em thấy ngứa quá!\" Helly bay xuống thấp hơn, lo lắng nói: \"Chắc vì bùn đất bám lâu quá rồi đó.\" Poli nghiêm túc nhưng vẫn nhẹ nhàng: \"Spookey, em cần đi rửa sạch ngay. Không được lười nữa.\""},{"image":"page8.png","audio":"audio/08.mp3","text":"Roy chuẩn bị vòi nước, còn Amber lấy khăn mềm và dung dịch vệ sinh an toàn. Bố mẹ Shopee cũng giúp chuẩn bị một chậu nước sạch để Shopee rửa tay sau khi chơi ngoài sân. Shopee đứng bên cạnh cổ vũ: \"Cố lên Spookey! Tắm xong sẽ sạch và dễ chịu lắm!\" Spookey ban đầu còn nhăn nhó: \"Nhưng nước lạnh lắm…\" Roy cười lớn: \"Không sao, anh sẽ chỉnh nước vừa đủ. Không lạnh đâu.\""},{"image":"page9.png","audio":"audio/09.mp3","text":"Thế là Spookey bắt đầu được tắm rửa. Roy xịt sạch bùn ở bánh xe. Amber lau thân xe thật nhẹ. Poli kiểm tra các khớp nối. Còn Helly bay trên cao soi đèn để xem còn chỗ nào bẩn không."},{"image":"page10.png","audio":"audio/10.mp3","text":"Một lúc sau, Spookey sạch bóng. Thân xe sáng lên, bánh xe không còn bùn, đèn cũng sáng rõ hơn. Spookey xoay một vòng rồi reo lên: \"Wow! Em thấy nhẹ người quá! Không còn ngứa nữa!\" Shopee vỗ tay: \"Spookey sạch rồi! Nhìn đẹp hơn hẳn!\" Spookey ngượng ngùng: \"Từ nay em cũng sẽ không lười tắm nữa.\" Amber dịu dàng nói thêm: \"Giữ cơ thể sạch sẽ không chỉ giúp mình khỏe mạnh, mà còn giúp mọi người xung quanh cảm thấy dễ chịu nữa.\" Helly bay vòng vui vẻ: \"Hoan hô Spookey sạch sẽ! Hoan hô Shopee ngoan ngoãn!\""},{"image":"page11.png","audio":"audio/11.mp3","text":"Tối hôm đó, khi về nhà, Shopee tự giác đi lấy khăn tắm. Mẹ ngạc nhiên hỏi: \"Hôm nay Shopee tự đi tắm luôn à?\" Shopee cười thật tươi: \"Vâng ạ! Con không muốn giống Spookey lúc bị bẩn đâu. Con muốn sạch sẽ, thơm tho và khỏe mạnh!\" Bố mẹ nhìn nhau mỉm cười. Từ hôm đó, Shopee không còn mè nheo mỗi khi đến giờ tắm nữa."},{"image":"page12.png","audio":"audio/12.mp3","text":"Bài học cho bé. Sau khi chơi đùa, chạy nhảy hoặc ra nhiều mồ hôi, bé cần tắm rửa sạch sẽ, rửa tay và thay quần áo sạch. Nếu lười tắm, cơ thể có thể bị bẩn, có mùi hôi, ngứa ngáy, nổi mẩn và dễ bị vi khuẩn làm cho ốm. Giữ cơ thể sạch sẽ giúp bé khỏe mạnh, thơm tho, tự tin và khiến mọi người xung quanh cảm thấy dễ chịu. Bé ngoan là bé biết giữ vệ sinh mỗi ngày."}]},{"n":8,"title":"Shopee và công trường an toàn","base":"Shopee-story-8","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee và công trường an toàn. Bài học hôm nay: công trường có máy móc và xe lớn là nơi rất nguy hiểm — bé không tự ý chạy vào, phải đứng sau vạch an toàn và luôn nghe lời người lớn."},{"image":"page1.png","audio":"audio/01.mp3","text":"Sáng chủ nhật, bố mẹ đưa Shopee đi dạo quanh khu phố. Đi được một đoạn, Shopee nhìn thấy một nơi thật rộng, có hàng rào màu cam vây xung quanh và rất nhiều xe to đang làm việc. Shopee reo lên: \"Mẹ ơi, xe gì mà to thế kia ạ?\" Mẹ cười nói: \"Đó là công trường con ạ. Người ta đang xây một ngôi trường mầm non mới cho các bạn nhỏ đấy.\" Bố chỉ tay giới thiệu: \"Chiếc xe ủi đất kia là Bruner. Chiếc chở đất là Dump. Còn chiếc đang trộn bê tông là Mickey đấy.\""},{"image":"page2.png","audio":"audio/02.mp3","text":"Shopee thích quá, bé muốn nhìn cho thật gần. Thế là khi bố mẹ đang nói chuyện, Shopee lẻn ra, chui qua một khe hở của hàng rào để chạy vào trong. \"Để con xem gần hơn một chút thôi!\""},{"image":"page3.png","audio":"audio/03.mp3","text":"Vừa lúc đó, một chiếc xe xúc nhỏ màu xanh nhìn thấy Shopee. Đó là Poke. Poke hoảng hốt kêu to: \"Dừng lại! Bạn nhỏ ơi, đừng vào đây!\" Phía trước, chiếc xe ủi Bruner đang lùi tới mà chưa nhìn thấy Shopee. Bruner phanh gấp một cái \"kítttt!\" thật to, dừng lại ngay sát chỗ bé đứng. Shopee giật mình, đứng sững lại, tim đập thình thịch. Cả công trường lập tức dừng máy, mọi thứ im lặng hẳn."},{"image":"page4.png","audio":"audio/04.mp3","text":"Bố mẹ chạy vội tới, ôm Shopee vào lòng: \"Shopee! Con không sao chứ? Sao con lại chạy vào đây?\" Shopee mếu máo: \"Con… con chỉ muốn xem xe gần hơn thôi mà…\""},{"image":"page5.png","audio":"audio/05.mp3","text":"Đúng lúc đó, Poli — chú xe cảnh sát của đội cứu hộ — chạy tới. Poli nhẹ nhàng nhưng nghiêm túc: \"Shopee, công trường là nơi rất nguy hiểm. Ở đây có nhiều máy móc to chạy liên tục. Các xe lớn nhiều khi không nhìn thấy một bạn nhỏ đứng phía sau đâu.\" Bruner cúi xuống, giọng vẫn còn run: \"Anh xin lỗi vì suýt va phải em. Lưỡi ủi của anh rất nặng, mắt anh lại để nhìn đất phía trước, nên anh không thấy em chạy vào.\" Shopee nhìn lưỡi ủi to đùng, lí nhí: \"Em… em không biết là nguy hiểm như vậy.\""},{"image":"page6.png","audio":"audio/06.mp3","text":"Mickey, chiếc xe trộn bê tông, từ từ tiến lại: \"Trong bồn của anh là bê tông ướt, rất nặng. Nếu chẳng may đổ trúng người thì nguy hiểm lắm. Bụi xi măng cũng làm cay mắt nữa.\" Max — chiếc xe lu thân hình to tròn — cũng góp lời: \"Còn anh thì lăn qua đâu là phẳng lì chỗ đó. Anh đi chậm thôi, nhưng nặng lắm, nên không thể tránh gấp được. Vì vậy các bạn nhỏ tuyệt đối không được đứng gần anh.\" Poke khẽ nói: \"Mỗi lần làm việc, chúng tớ đều phải đội mũ bảo hộ và nhìn thật kỹ xung quanh. Công trường không phải chỗ để chơi đâu.\""},{"image":"page7.png","audio":"audio/07.mp3","text":"Mẹ ngồi xuống ngang tầm mắt Shopee: \"Con thấy chưa? Khi muốn xem gì, con phải xin phép bố mẹ trước, và phải đứng ở nơi an toàn. Không được tự ý chạy vào nơi có máy móc.\" Shopee gật đầu thật mạnh: \"Con xin lỗi mẹ. Con sẽ không tự ý chạy vào nữa ạ.\" Poli mỉm cười: \"Biết nhận lỗi là rất ngoan. Bây giờ, nếu con muốn xem các bạn ấy làm việc, chú sẽ giúp con xem một cách an toàn nhé.\""},{"image":"page8.png","audio":"audio/08.mp3","text":"Poli đưa cho Shopee một chiếc mũ bảo hộ màu vàng nhỏ xinh. Bố đội lên đầu cho bé, vừa khít. \"Đội mũ bảo hộ để bảo vệ đầu, phòng khi có vật rơi xuống,\" bố giải thích. Rồi Poli dẫn cả nhà ra đứng phía sau một vạch kẻ màu vàng, cách xa khu máy móc. \"Đây là vạch an toàn. Người không làm việc chỉ được đứng ngoài vạch này thôi,\" Poli nói."},{"image":"page9.png","audio":"audio/09.mp3","text":"Từ chỗ an toàn, Shopee được xem cả đội làm việc thật nhịp nhàng. Bruner ủi đất cho phẳng. Dump chở đất đá đổ sang một bên. Mickey trộn bê tông quay tròn đều đều. Max lăn qua làm nền cứng và phẳng. Còn Poke nhỏ nhắn thì luồn vào những góc hẹp mà các anh lớn không vào được. Shopee vỗ tay reo lên: \"Các anh giỏi quá! Mỗi anh làm một việc, ghép lại thành cả ngôi trường!\" Poke vui vẻ: \"Đúng rồi! Và quan trọng nhất là chúng tớ luôn làm việc an toàn. An toàn rồi mới làm nhanh được.\""},{"image":"page10.png","audio":"audio/10.mp3","text":"Một lúc sau, Titan — chiếc xe ben khổng lồ — chở tới một thùng vật liệu rất lớn. Titan đi tới đâu, mặt đất rung rinh tới đó. Titan cười hiền: \"Chào bạn nhỏ! Em thấy chưa, anh to lớn thế này, nếu em đứng gần mà anh không thấy thì rất nguy hiểm. Nên em đứng sau vạch vàng là đúng rồi đó.\" Shopee ngước nhìn Titan, gật gù: \"Vâng ạ! Em sẽ luôn đứng ở chỗ an toàn.\""},{"image":"page11.png","audio":"audio/11.mp3","text":"Khi cả nhà chuẩn bị ra về, Shopee chạy lại trả mũ bảo hộ cho Poli và nói: \"Cảm ơn các anh đã cho em xem. Lần sau em sẽ xin phép và đứng đúng chỗ, không chạy lung tung nữa ạ.\" Trên đường về, Shopee nắm tay mẹ, nói thật rõ ràng: \"Mẹ ơi, công trường nguy hiểm lắm. Con nhớ rồi: không chui qua hàng rào, không lại gần máy móc, và phải đội mũ bảo hộ nếu được vào.\" Bé hãy luôn nhớ: công trường có máy móc và xe lớn là nơi rất nguy hiểm, đừng bao giờ tự ý chui hàng rào hay chạy vào trong; muốn đến gần xem gì thì phải xin phép bố mẹ và đứng sau vạch an toàn. Bé biết giữ an toàn cho mình là bé rất ngoan."}]},{"n":9,"title":"Shopee và chuyến tham quan cảng biển","base":"Shopee-story-9","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee và chuyến tham quan cảng biển. Bài học hôm nay: cảng biển và mép nước rất nguy hiểm — bé không tự ý ra gần mép nước, phải mặc áo phao, đứng sau vạch an toàn và luôn đi cùng người lớn."},{"image":"page1.png","audio":"audio/01.mp3","text":"Sáng thứ Bảy trời trong xanh, bố mẹ đưa Shopee đi chơi ở cảng biển Brooms Harbor. Vừa tới nơi, Shopee đã há hốc miệng vì ngạc nhiên. Trước mặt bé là mặt nước rộng mênh mông, và những con tàu to lớn chưa từng thấy đang đậu san sát bên cầu cảng. \"Oa! Tàu to ơi là to! To hơn cả ngôi nhà của mình luôn ạ!\" Shopee reo lên, mắt tròn xoe."},{"image":"page2.png","audio":"audio/02.mp3","text":"Mẹ nắm tay bé, mỉm cười: \"Đây là cảng biển con ạ. Tàu thuyền chở hàng hóa từ khắp nơi cập bến ở đây. Con nhìn xem, mỗi con tàu một nhiệm vụ khác nhau đấy.\" Bố chỉ tay giới thiệu từng nhân vật: \"Con tàu xanh trắng đội mũ thuyền trưởng kia là chú Marine, chuyên chở hàng. Con tàu khổng lồ chở đầy thùng nhiều màu là chị Cici, tàu container. Còn ba cái cần cẩu cao vàng, cam, xanh đang nâng hàng là ba anh em Lefy, Leky và Lety đấy.\" Chú Marine nhìn thấy cả nhà, vui vẻ kéo còi chào: \"Tu… tu! Chào bạn nhỏ! Hôm nay ra cảng chơi à? Nhớ đứng phía sau vạch vàng cho an toàn nhé!\""},{"image":"page3.png","audio":"audio/03.mp3","text":"Shopee thích quá, bé muốn nhìn chị Cici và những con tàu cho thật gần. Thế là khi bố mẹ đang mải nói chuyện, Shopee lẻn ra, bước qua vạch kẻ vàng và chạy thẳng về phía mép cầu cảng. \"Để con ra gần xem một chút thôi mà!\""},{"image":"page4.png","audio":"audio/04.mp3","text":"Cầu cảng ướt và trơn. Càng chạy ra gần mép nước, Shopee càng thấy mặt nước sâu thẳm ngay dưới chân mình. Bất ngờ bé bị trượt chân, loạng choạng chới với ngay sát bờ. Chị Cici nhìn thấy, hốt hoảng kêu vang: \"Dừng lại! Bạn nhỏ ơi, nguy hiểm lắm, lùi vào trong ngay!\" Ngay phía trên đầu Shopee, anh cần cẩu Lefy đang nhấc một thùng container thật nặng. Lefy vội phanh \"kítttt!\", giữ chặt thùng hàng lơ lửng trên cao để không có gì rơi xuống. Cả cảng lập tức dừng lại, mọi thứ im lặng hẳn."},{"image":"page5.png","audio":"audio/05.mp3","text":"Bố mẹ hốt hoảng chạy vụt tới, vội kéo Shopee lùi lại khỏi mép nước rồi ôm chầm lấy bé: \"Shopee! Con không sao chứ? Sao con lại tự chạy ra mép nước thế này?\" Shopee mếu máo, giọng run run: \"Con… con chỉ muốn xem tàu gần hơn thôi mà…\""},{"image":"page6.png","audio":"audio/06.mp3","text":"Thuyền trưởng Marine từ từ tiến lại gần bờ, giọng trầm ấm nhưng nghiêm túc: \"Shopee à, mép cầu cảng là nơi rất nguy hiểm. Nước ở đây sâu lắm, lại không nhìn rõ đáy. Cầu cảng thì ướt và trơn, chỉ cần một bước hụt là con có thể ngã xuống nước đấy.\" Marine ngừng một chút rồi nói tiếp: \"Chú là tàu rất to và nặng. Khi chú di chuyển, chú không thể dừng lại ngay được. Nếu có bạn nhỏ ở dưới nước mà chú không nhìn thấy thì nguy hiểm vô cùng. Vì vậy con tuyệt đối không được lại gần mép nước một mình.\""},{"image":"page7.png","audio":"audio/07.mp3","text":"Ba anh em cần cẩu Lefy, Leky, Lety cũng nhẹ nhàng hạ thùng hàng xuống rồi góp lời: \"Các anh nâng những thùng hàng rất nặng bay qua bay lại trên cao. Em đứng ngay phía dưới, lỡ có vật gì rơi xuống thì thật đáng sợ. Nên em phải tránh xa chỗ các anh đang làm việc nhé.\" Shopee nhìn quanh: chỗ nào cũng là nước sâu, dây thừng, thùng hàng to và máy móc đang chạy. Bé bắt đầu hiểu ra, lí nhí: \"Con xin lỗi ạ. Con không biết cảng biển lại nguy hiểm như vậy. Con sẽ không tự ý chạy ra mép nước nữa.\""},{"image":"page8.png","audio":"audio/08.mp3","text":"Thuyền trưởng Marine mỉm cười hiền hậu: \"Biết nhận lỗi là rất ngoan. Bây giờ, nếu con muốn xem mọi người làm việc, chú sẽ giúp con xem một cách thật an toàn nhé.\" Chú Marine đưa cho Shopee một chiếc áo phao nhỏ màu cam. Mẹ mặc áo phao vào cho bé, cài khóa cẩn thận. \"Mặc áo phao để nếu chẳng may rơi xuống nước, con vẫn nổi lên được và không bị chìm,\" mẹ giải thích. \"Khi ở gần nước hay lên tàu, ai cũng phải mặc áo phao con nhé.\""},{"image":"page9.png","audio":"audio/09.mp3","text":"Rồi bố mẹ dẫn Shopee ra đứng phía sau vạch kẻ vàng, cách xa mép nước và khu cần cẩu đang làm việc. Từ chỗ an toàn, Shopee được ngắm cả đội làm việc thật nhịp nhàng. Chị Cici từ từ cập bến. Ba anh em Lefy, Leky, Lety thay nhau nâng từng thùng container đặt lên bờ gọn gàng. Chú Marine hú còi \"tu… tu!\" rồi chở hàng rời cảng, rẽ sóng trắng xóa ra biển. Shopee vỗ tay reo lên: \"Các bạn giỏi quá! Mỗi bạn làm một việc, ghép lại thành cả một bến cảng tấp nập!\""},{"image":"page10.png","audio":"audio/10.mp3","text":"Khi cả nhà chuẩn bị ra về, Shopee chạy lại trả áo phao cho chú Marine và nói: \"Cảm ơn chú và các anh chị đã cho em xem. Lần sau em sẽ xin phép bố mẹ, mặc áo phao và đứng đúng chỗ, không chạy ra mép nước nữa ạ.\" Trên đường về, Shopee nắm chặt tay mẹ, nói thật rõ ràng: \"Mẹ ơi, cảng biển nguy hiểm lắm. Con nhớ rồi: không chạy ra mép nước, không đứng dưới cần cẩu, và phải mặc áo phao khi ở gần nước.\" Bố mẹ nhìn nhau mỉm cười."},{"image":"page11.png","audio":"audio/11.mp3","text":"Bài học cho bé. Cảng biển và mép nước là nơi rất nguy hiểm. Nước ở cảng rất sâu, cầu cảng lại ướt và trơn, nên bé tuyệt đối không tự ý chạy ra gần mép nước một mình. Tàu thuyền rất to và nặng, di chuyển không thể dừng lại ngay được. Cần cẩu nâng những thùng hàng rất nặng trên cao, nên bé phải tránh xa khu vực đang xếp dỡ hàng. Khi ở gần nước hoặc lên tàu, bé phải mặc áo phao và luôn đi cùng người lớn. Bé biết giữ an toàn cho mình là bé rất ngoan."}]},{"n":10,"title":"Shopee và những người bạn chăm chỉ của thành phố","base":"Shopee-story-10","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee và những người bạn chăm chỉ của thành phố. Bài học hôm nay: mỗi người một việc — biết ơn những người lao động và cùng nhau giúp đỡ khi gặp khó khăn."},{"image":"page1.png","audio":"audio/01.mp3","text":"Sáng sớm Chủ nhật, bầu trời còn hơi sương, Shopee được mẹ dắt tay đi bộ ra phố. Thành phố vừa thức dậy, đường sá đã bắt đầu nhộn nhịp tiếng xe cộ. Shopee ngước nhìn quanh, thích thú reo lên: Mẹ ơi, buổi sáng phố mình đông vui ghê! Ai cũng đang làm gì đó hết kìa. Mẹ mỉm cười dặn: Đúng rồi con. Để thành phố mình sạch đẹp và mọi nhà có đủ thứ cần dùng, có rất nhiều bạn xe chăm chỉ làm việc từ sớm tinh mơ đấy. Mình cùng đi xem nhé."},{"image":"page2.png","audio":"audio/02.mp3","text":"Vừa ra tới đầu phố, Shopee đã thấy một bạn xe màu xanh lá pha cam, có cánh tay với miếng chà mềm, đang cần mẫn quét dọn vỉa hè. Đó là bạn Cleany, xe quét đường. Rẹt, rẹt, rẹt! Cleany gom hết lá rụng và rác vụn vào thùng, để lại con đường sạch bong. Cleany vui vẻ chào: Chào bạn nhỏ! Tớ là Cleany. Mỗi sáng tớ quét sạch đường phố để mọi người đi lại thật thoải mái. Phố sạch thì ai cũng vui, em nhỉ? Shopee gật đầu lia lịa: Dạ! Nhờ anh Cleany mà đường đẹp ghê. Em cảm ơn anh ạ!"},{"image":"page3.png","audio":"audio/03.mp3","text":"Đi thêm một đoạn, hai mẹ con gặp bạn Posty, xe bưu chính màu xanh dương với thùng thư đỏ in hình phong bì. Posty đang đặt những lá thư và bưu phẩm vào trước cửa từng nhà. Cộc cộc! Thư đến rồi đây! Posty reo lên. Tớ mang thư từ và quà từ khắp nơi đến cho mọi người. Có khi là lời chúc của bà, có khi là món quà sinh nhật mà các bạn nhỏ mong lắm đấy! Shopee tròn mắt thán phục: Oa, anh Posty mang cả tin vui đến cho mọi nhà luôn ạ!"},{"image":"page4.png","audio":"audio/04.mp3","text":"Tới ngã tư, một bạn taxi màu vàng bóng loáng, kẻ sọc caro đen trắng, dừng lại đón khách rồi nhẹ nhàng lăn bánh. Đó là bác Cap. Bíp bíp! Tớ là Cap đây, bác Cap nói, giọng đầy tự hào. Tớ chở các cô chú đi làm, đi học cho kịp giờ. Tớ luôn giữ mình thật sạch sẽ và đi thật đúng giờ để mọi người yên tâm. Shopee vẫy tay chào: Em chào bác Cap! Bác chạy xe đẹp quá ạ."},{"image":"page5.png","audio":"audio/05.mp3","text":"Mải ngắm các bạn, Shopee bỗng nghe tiếng máy quen thuộc phía sau. Một bạn xe giao hàng nhỏ màu xanh lá, chở đầy thùng hàng cao ngất, đang chạy tới. Đó là Rody, xe giao hàng chăm chỉ. Chào cả nhà! Hôm nay nhiều đơn quá, tớ phải giao cho thật nhanh mới kịp, Rody vừa nói vừa vội vàng tăng tốc qua chỗ gồ ghề trên đường. Nhưng vì chở quá nhiều và đi hơi nhanh, một thùng hàng trên cùng bỗng chao đảo rồi rơi bịch xuống mặt đường. Thùng bung ra, bao nhiêu là cam, táo, hộp bánh lăn lông lốc khắp nơi."},{"image":"page6.png","audio":"audio/06.mp3","text":"Ngay lập tức, cả một đoạn đường bị chặn lại. Xe cộ phía sau dồn ứ, nối nhau một hàng dài. Vài bạn xe nóng ruột bấm còi inh ỏi: Bíp! Bíp! Bíp! Rody lúng túng, không biết phải làm sao, suýt thì bật khóc. Shopee định chạy ào ra nhặt giúp, nhưng mẹ kịp giữ tay bé lại và dặn: Khoan đã con. Ngoài đường nhiều xe đang chạy, con không được tự chạy ra. Mình đứng trên vỉa hè quan sát, để các bạn xe lo trước nhé."},{"image":"page7.png","audio":"audio/07.mp3","text":"Đúng lúc ấy, bác Cap taxi liền bật đèn vàng nhấp nháy, từ tốn lùi lại nhường một khoảng trống và nói lớn với các xe phía sau: Mọi người bình tĩnh nào! Bấm còi sẽ không giúp đường nhanh thông đâu. Cùng chờ một chút, chúng tớ dọn ngay đây!"},{"image":"page8.png","audio":"audio/08.mp3","text":"Bạn Cleany lập tức chạy tới, dùng cánh tay quét gom cam táo và bánh kẹo lại thành một đống gọn gàng bên đường. Bạn Posty nhanh nhẹn nhặt từng món xếp lại vào thùng giúp Rody. Còn bác Cap thì hướng dẫn các xe lần lượt đi vòng qua chỗ trống, không ai phải chen lấn. Chỉ một lát sau, mặt đường đã sạch sẽ trở lại, thùng hàng được xếp ngay ngắn, và dòng xe lại lăn bánh êm ru. Tiếng còi inh ỏi cũng ngừng hẳn. Shopee đứng trên vỉa hè, vỗ tay reo lên: Các bạn giỏi quá! Anh Cleany dọn đường, anh Posty xếp hàng, bác Cap chỉ lối… mỗi người một việc, ghép lại là cả con phố thông suốt liền!"},{"image":"page9.png","audio":"audio/09.mp3","text":"Rody cảm động, rối rít cảm ơn: Cảm ơn các cậu nhiều lắm! Một mình tớ thì chẳng biết xoay xở thế nào. Nhờ mỗi người giúp một tay mà mọi chuyện ổn cả rồi. Bác Cap cười hiền: Không có gì đâu. Bạn bè là phải giúp nhau lúc khó khăn chứ. Mà lần sau cháu nhớ đừng chở quá nặng và đừng vội quá nhé, đi từ từ cho an toàn. Cả bốn bạn xe đều cười thật tươi, đồng loạt bấm còi bíp bíp vui vẻ. Rody còn dúi vào tay Shopee một quả cam chín mọng: Tặng em một quả này, cảm ơn em đã động viên anh nhé! Trước khi đi, Shopee nhặt một vỏ hộp bánh rơi dưới chân, bỏ gọn vào thùng rác bên đường. Cleany thấy vậy thích lắm: Hoan hô! Em biết bỏ rác đúng chỗ, vậy là em đang giúp anh giữ phố sạch rồi đấy!"},{"image":"page10.png","audio":"audio/10.mp3","text":"Trên đường về, Shopee nắm chặt tay mẹ, ôm quả cam vào lòng, nói thật rõ ràng: Mẹ ơi, hôm nay con vui lắm. Con biết rồi: ai cũng có việc của mình và ai cũng đáng quý. Con sẽ luôn nói cảm ơn các cô các chú, sẽ bỏ rác đúng chỗ, và khi có chuyện thì mình bình tĩnh giúp nhau, không bấm còi inh ỏi nữa. Bố mẹ nhìn nhau mỉm cười. Hôm nay Shopee đã có một buổi sáng dạo phố thật vui và học được một bài học thật ấm áp."},{"image":"page11.png","audio":"audio/11.mp3","text":"Bài học cho bé. Một, trong thành phố có rất nhiều người và nhiều bạn xe làm việc chăm chỉ; mỗi người một việc, ai cũng quan trọng và đều đáng được quý trọng. Hai, bé hãy biết nói cảm ơn và lễ phép với các cô chú, các bác đang làm việc quanh mình. Ba, khi có sự cố xảy ra, bé hãy bình tĩnh; nóng giận hay bấm còi inh ỏi không giúp giải quyết được gì, cùng nhau giúp một tay thì mọi chuyện sẽ nhanh ổn. Bốn, bé hãy bỏ rác đúng nơi quy định để giữ cho đường phố luôn sạch đẹp. Năm, ngoài đường có nhiều xe qua lại, bé tuyệt đối không tự chạy ra lòng đường; muốn giúp gì cũng phải đứng cùng bố mẹ trên vỉa hè cho an toàn. Biết yêu thương, biết ơn và giúp đỡ mọi người là bé rất ngoan."}]},{"n":11,"title":"Shopee và bài học không bỏ cuộc của Mini","base":"Shopee-story-11","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee và bài học không bỏ cuộc của Mini. Bài học hôm nay: Kiên trì, không bỏ cuộc — thất bại cũng không sao, cứ thử lại là sẽ làm được."},{"image":"page1.png","audio":"audio/01.mp3","text":"Chiều nay, bố đưa bé Shopee ra sân trạm cứu hộ để tập đi xe đạp. Sân rộng và bằng phẳng. Shopee leo lên chiếc xe đạp nhỏ, đạp được vài vòng thì bịch một cái, bé loạng choạng ngã lăn ra cỏ. Shopee phụng phịu, mắt rơm rớm, mếu máo: Hức… con ngã ba lần rồi. Khó quá, con không tập nữa đâu bố! Bố đỡ Shopee dậy, phủi đất trên đầu gối cho bé và dịu dàng động viên: Ngã một chút thôi mà, con đừng nản. Ai mới tập cũng vậy cả. Nhưng Shopee vẫn ngồi bệt xuống cỏ, ôm đầu gối, chẳng muốn thử lại."},{"image":"page2.png","audio":"audio/02.mp3","text":"Đúng lúc đó, từ ngoài cổng, một chiếc xe cổ điển màu xanh navy bóng loáng, đội chiếc mũ trắng lịch lãm, từ từ tiến vào sân. Đó là ông Musty. Đi bên cạnh ông là một cô xe nhỏ màu vàng pha hồng, có chiếc nơ hồng xinh xắn trên nóc — đó là bé Mini, cháu gái của ông. Ông Musty vui vẻ chào: Chào cả nhà! Hôm nay ông cháu ta sang trạm chơi, tiện cho Mini tập leo dốc với các bạn. Chị Jin từ trong trạm bước ra, vui vẻ chào đón ông cháu."},{"image":"page3.png","audio":"audio/03.mp3","text":"Ở góc sân có một con dốc tập nhỏ mà đội cứu hộ vẫn dùng để rèn luyện. Mini ngước nhìn con dốc, bánh xe khẽ run lên. Mini rụt rè thưa: Ông ơi… con muốn tự leo lên đỉnh dốc, để mai sau con theo kịp các anh trong đội. Nhưng… con sợ con không làm được. Ông Musty mỉm cười hiền hậu: Cứ thử xem nào, cháu của ông. Ông tin cháu mà."},{"image":"page4.png","audio":"audio/04.mp3","text":"Mini hít một hơi, rồi rồ máy lao lên dốc. Nhưng lên được nửa chừng, bánh xe bé xíu của Mini đuối sức, xe tụt dần… tụt dần… rồi trôi ngược trở lại chân dốc. Mini buồn xo: Thấy chưa ông, con đã bảo mà…"},{"image":"page5.png","audio":"audio/05.mp3","text":"Mini cố thêm lần nữa. Lần này xe nhích cao hơn một chút, nhưng rồi vẫn tụt xuống. Hai hàng nước mắt lăn dài, Mini nghẹn ngào: Con bỏ cuộc đây. Con leo mãi không được. Con dở quá! Ông Musty từ tốn tiến lại gần cháu, giọng ấm áp: Mini à, hồi ông còn nhỏ, ông cũng từng tập leo con dốc này. Ông tụt xuống không biết bao nhiêu lần, có hôm còn nhiều hơn cháu bây giờ đấy. Nhưng ông không bỏ cuộc. Thất bại không có gì đáng xấu hổ cả — bỏ cuộc khi chưa cố hết sức mới đáng tiếc."},{"image":"page6.png","audio":"audio/06.mp3","text":"Cả biệt đội cứu hộ nghe vậy liền xúm lại cổ vũ. Đội trưởng Poli nháy đèn xanh đỏ, dặn: Mini đừng vội! Em đi thật chậm và chắc từng chút một, đừng cố nhanh quá nhé. Xe cứu hỏa Roy gật gù bằng cả thân hình vạm vỡ: Lần này em lùi ra xa hơn để lấy đà, rồi giữ đều ga mà tiến lên. Anh tin em làm được! Trực thăng Helly bay vè vè phía trên, reo lên lạc quan: Cố lên Mini ơi! Nhìn lên đỉnh dốc mà tiến, đừng nhìn xuống dưới nhé! Xe cứu thương Amber dịu dàng đến bên Mini: Em làm tốt lắm rồi. Mỗi lần thử là một lần em giỏi thêm một chút đấy. Bé Shopee đang ngồi trên cỏ cũng quên cả buồn, đứng bật dậy vỗ tay: Cố lên bạn Mini! Bạn làm được mà!"},{"image":"page7.png","audio":"audio/07.mp3","text":"Được mọi người tiếp sức, Mini lau nước mắt. Cô bé lùi ra thật xa lấy đà như lời anh Roy dặn, hít một hơi thật sâu, rồi từ từ tiến lên — chậm mà chắc, mắt hướng thẳng lên đỉnh dốc."},{"image":"page8.png","audio":"audio/08.mp3","text":"Vù… vù… vù… bánh xe quay đều. Lên quá nửa dốc rồi! Mini hơi chùn lại, nhưng nghe tiếng cả đội hô vang Cố lên, cố lên, cô bé nghiến răng tiến thêm… thêm chút nữa… Tới rồi! Mini đã đứng vững trên đỉnh dốc! Cả sân vỡ òa trong tiếng reo hò. Poli hú còi, Helly lượn vòng trên trời, Shopee nhảy cẫng lên sung sướng. Mini ngỡ ngàng nhìn xuống chân dốc xa tít, rồi cười thật tươi: Con… con làm được thật rồi ông ơi! Hóa ra chỉ cần thử thêm một lần nữa thôi! Ông Musty rưng rưng tự hào: Giỏi lắm, cháu của ông! Cháu thấy không, thành công luôn đứng đợi ở ngay sau lần thử cuối cùng đấy."},{"image":"page9.png","audio":"audio/09.mp3","text":"Nhìn Mini, bé Shopee chợt thấy ngượng vì lúc nãy mình đã định bỏ cuộc. Bé chạy lại dựng chiếc xe đạp lên, quyết tâm: Con cũng sẽ không bỏ cuộc nữa! Con thử lại đây! Shopee leo lên xe, bố giữ nhẹ phía sau. Lần này bé đạp chậm rãi, giữ thăng bằng cẩn thận. Một vòng… hai vòng… ba vòng — chiếc xe lăn bánh bon bon mà không hề ngã! Shopee reo lên: Bố ơi, con đạp được rồi! Con đạp được rồi này!"},{"image":"page10.png","audio":"audio/10.mp3","text":"Bố mẹ vỗ tay, Mini và ông Musty cùng cả biệt đội cứu hộ reo mừng cho Shopee. Ông Musty nhìn hai đứa trẻ, gật gù nói câu ông vẫn luôn tâm đắc: Đấy, các cháu thấy chưa? Khó khăn nào cũng sẽ qua, miễn là mình đừng bỏ cuộc."},{"image":"page11.png","audio":"audio/11.mp3","text":"Bài học cho bé: Khi gặp việc khó, bé đừng vội nản hay bỏ cuộc nhé. Thất bại một vài lần là chuyện rất bình thường. Cứ bình tĩnh, hít thở thật sâu và kiên trì thử lại, rồi bé sẽ làm được. Thành công luôn chờ ta ở ngay sau lần cố gắng tiếp theo!"}]},{"n":12,"title":"Shopee và chuyến tàu về nông trại cùng bác Trino","base":"Shopee-story-12","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee và chuyến tàu về nông trại cùng bác Trino. Bài học hôm nay: An toàn khi đi tàu hỏa và khi đi chơi xa. Đứng sau vạch vàng, không thò đầu thò tay ra ngoài, bám chắc tay vịn, và luôn đi sát bố mẹ ở nơi đông người."},{"image":"page1.png","audio":"audio/01.mp3","text":"Sáng thứ Bảy, trời trong veo, cả nhà Shopee dậy thật sớm. Hôm nay là một ngày đặc biệt: bố mẹ đưa Shopee đi tàu hỏa về thăm nông trại Brooms Farm ở vùng quê. Shopee háo hức đến nỗi nhảy chân sáo suốt dọc đường ra ga. Bé reo lên: Mẹ ơi, con sắp được đi tàu hỏa thật rồi! Tàu chạy xình xịch xình xịch đúng không mẹ?"},{"image":"page2.png","audio":"audio/02.mp3","text":"Mẹ cười, nắm chặt tay bé và dặn: Đúng rồi con. Nhưng ga tàu đông người lắm, con phải nắm tay bố mẹ thật chặt, không được chạy lung tung nhé. Vừa bước vào sân ga, Shopee đã choáng ngợp. Người đi lại tấp nập, vali kéo lạch cạch, loa thông báo vang vang. Thích quá, Shopee buông tay mẹ, định chạy ào lên phía trước. Mẹ vội gọi: Shopee, khoan đã con! Bố ngồi xuống ngang tầm mắt bé, nhẹ nhàng: Nơi đông người thế này, nếu con chạy một mình, lỡ lạc mất bố mẹ thì sao? Con đi sát bố mẹ, nắm tay thật chặt, vậy mới an toàn. Shopee gật đầu, ngoan ngoãn nắm lấy tay bố."},{"image":"page3.png","audio":"audio/03.mp3","text":"Hú… u… u! Choo-choo! Một hồi còi vang lên. Từ xa, một bác tàu hỏa hơi nước to lớn, thân màu đỏ pha vàng, nhả những làn khói trắng bồng bềnh, từ từ tiến vào ga. Đó là bác Trino. Shopee thích thú reo lên: Oa! Tàu tới rồi! To ơi là to! Mê quá, bé nhoài người về phía trước, định bước qua vạch sơn vàng dưới chân. Bác Trino trông thấy, vội hú còi nhắc: Bé ơi, lùi lại sau vạch vàng nào! Khi bác vào ga, gió cuốn rất mạnh, mà mép ke ga thì sát đường ray nguy hiểm lắm. Vạch vàng là ranh giới an toàn, các bạn nhỏ phải luôn đứng phía sau nó cháu nhé. Shopee giật mình lùi lại, nép sát vào chân mẹ: Dạ… con xin lỗi ạ. Con không biết. Bác Trino cười hiền hậu: Không sao, giờ cháu biết rồi. Nào, mời cả nhà lên tàu!"},{"image":"page4.png","audio":"audio/04.mp3","text":"Khi bước lên bậc tàu, bố nhắc Shopee bám chắc vào tay vịn: Con vịn tay vào đây này, bước từng bước một cho chắc, đừng vội kẻo trượt chân. Shopee bám tay vịn, bước lên thật cẩn thận, rồi cùng bố mẹ ngồi vào ghế bên cửa sổ. Đoàn tàu lăn bánh, xình xịch… xình xịch…, cảnh vật bên ngoài bắt đầu chạy lùi về phía sau."},{"image":"page5.png","audio":"audio/05.mp3","text":"Cảnh đồng quê hiện ra đẹp như tranh. Gió mát lùa qua khe cửa. Thích quá, Shopee mở rộng cửa sổ, định thò cả đầu và tay ra ngoài đón gió: Mẹ ơi, gió mát quá! Con thò tay ra ngoài chút xíu thôi nha… Bác Trino qua ô cửa liền lên tiếng, giọng ân cần mà nghiêm túc: Đừng cháu ơi! Khi tàu đang chạy, tuyệt đối không thò đầu, thò tay ra ngoài cửa sổ. Bên đường có cột điện, cành cây, có khi lại có tàu khác chạy ngược chiều lướt qua rất sát. Mình ngồi yên bên trong ngắm cảnh là vui và an toàn nhất rồi. Shopee rụt tay vào ngay, ngoan ngoãn ngồi ngay ngắn ngắm cảnh qua ô cửa kính."},{"image":"page6.png","audio":"audio/06.mp3","text":"Ngồi một lúc, Shopee lại thấy buồn chân. Bé tụt khỏi ghế, định chạy nhảy dọc lối đi giữa các toa cho vui. Đúng lúc đó, tàu vào một khúc cua, thân tàu khẽ lắc kĩu… kịt… Một bạn nhỏ ở toa bên đang đứng mà không bám vịn, bị chao người suýt ngã. May có mẹ bạn ấy đỡ kịp. Bác Trino ân cần nhắc: Cháu thấy không? Khi tàu đang chạy, thân tàu hay rung lắc bất ngờ. Nếu cần đi lại, cháu phải bám chắc vào tay vịn và đi thật chậm. Còn không thì ngồi yên trên ghế là tốt nhất, kẻo ngã đau đấy. Shopee vội leo lại lên ghế, ngồi ngay ngắn: Con hiểu rồi ạ. Con sẽ ngồi yên, lúc nào cần đi thì con bám tay vịn. Mẹ xoa đầu bé, âu yếm: Con trai mẹ ngoan lắm. Đi tàu mà biết giữ an toàn là con đã lớn rồi đấy."},{"image":"page7.png","audio":"audio/07.mp3","text":"Chẳng mấy chốc, bác Trino hú một hồi còi dài: Choo-choo! Ga Brooms Farm đã tới! Tàu từ từ dừng lại. Sân ga quê cũng đông người lên xuống. Lần này, Shopee không cần ai nhắc nữa. Bé tự giác nắm chặt tay mẹ, đi sát bố mẹ, bước xuống bậc tàu thật cẩn thận và đứng lại phía sau vạch vàng chờ mọi người."},{"image":"page8.png","audio":"audio/08.mp3","text":"Vừa ra khỏi ga, một bác xe cắm trại màu xanh ngọc vui tính, đội mũ cam và đeo kính tròn, đã đợi sẵn. Đó là bác Camp. Bác vui vẻ chào: Chào nhà Shopee! Lên đây, bác chở cả nhà ra nông trại nào! Hôm nay đồng quê đẹp lắm đây! Bác Camp chở cả nhà băng qua những cánh đồng xanh mướt."},{"image":"page9.png","audio":"audio/09.mp3","text":"Đến nơi, một chú máy kéo màu xanh dương, đội chiếc mũ rơm, đang cần mẫn cày đất, thấy khách thì dừng lại chào. Đó là chú Tracky. Chú hỏi: Chào bạn nhỏ! Cháu đi tàu đường xa có mệt không? Shopee nhanh nhảu đáp: Dạ không ạ! Con đi tàu với bác Trino vui lắm. Con đã biết đứng sau vạch vàng, không thò tay ra ngoài, và ngồi yên bám tay vịn nữa cơ! Chú Tracky và bác Camp nhìn nhau, cùng bật cười khen ngợi: Giỏi quá! Một bạn nhỏ biết giữ an toàn khi đi chơi xa thì đi đâu cũng vui, cũng được mọi người yên tâm. Cả buổi chiều hôm ấy, Shopee được bác Camp dẫn đi ngắm đồng lúa, được chú Tracky cho ngồi thử trên ghế lái máy kéo. Vui ơi là vui."},{"image":"page10.png","audio":"audio/10.mp3","text":"Khi mặt trời xuống thấp, cả nhà tạm biệt bác Camp và chú Tracky để ra ga về nhà. Bác Trino đã chờ sẵn, nhả khói phù… phù… thân thiện. Lần này, suốt chặng về, Shopee ngồi thật ngoan bên cửa sổ, nắm tay mẹ, ngắm hoàng hôn đỏ rực trải dài trên cánh đồng. Bác Trino nhìn qua ô cửa, gật gù hài lòng: Đấy, cháu thấy chưa? Biết giữ an toàn thì chuyến đi nào cũng trở thành một chuyến đi thật vui và đáng nhớ. Tối hôm đó về đến nhà, Shopee ôm cổ mẹ, ngái ngủ thì thầm: Mẹ ơi, hôm nay con đi chơi xa mà vẫn an toàn. Lần sau đi tàu, con vẫn sẽ đứng sau vạch vàng, ngồi yên trên ghế, và luôn nắm tay bố mẹ thật chặt."},{"image":"page11.png","audio":"audio/11.mp3","text":"Bài học cho bé. Khi đi tàu hỏa hay đi chơi xa, bé hãy nhớ những điều này để luôn được an toàn nhé. Một, ở sân ga và những nơi đông người, bé luôn đi sát và nắm chặt tay bố mẹ, không tự ý chạy lung tung kẻo bị lạc. Hai, bé phải luôn đứng phía sau vạch vàng an toàn, không lại gần mép đường ray, nhất là khi tàu đang vào ga. Ba, khi lên xuống tàu, bé bám chắc tay vịn và bước từng bước thật cẩn thận. Bốn, lúc tàu đang chạy, bé tuyệt đối không thò đầu, thò tay ra ngoài cửa sổ. Năm, bé hãy ngồi yên trên ghế; nếu cần đi lại thì phải bám tay vịn và đi thật chậm, vì tàu có thể rung lắc bất ngờ. Biết giữ an toàn cho mình khi đi xa là bé đã rất ngoan và rất giỏi rồi đấy!"}]},{"n":13,"title":"Shopee và bài học về ổ điện","base":"Shopee-story-13","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee và bài học về ổ điện. Bài học hôm nay: an toàn điện trong nhà và ngoài đường — không nghịch ổ điện, không chạm thiết bị điện khi tay ướt, và tránh xa cột điện, dây điện."},{"image":"page1.png","audio":"audio/01.mp3","text":"Chiều nay trời mưa lất phất, Shopee ở nhà chơi với chú robot đồ chơi mà bé yêu thích nhất. Mẹ đang bận nấu cơm trong bếp, mùi thức ăn thơm lừng bay khắp nhà. Đang chơi vui thì chú robot bỗng đi chậm dần, chậm dần, rồi đứng im hẳn. Shopee reo lên: Ơ, robot hết pin rồi! Mình phải sạc cho bạn ấy thôi."},{"image":"page2.png","audio":"audio/02.mp3","text":"Shopee nhớ ra bố vẫn hay cắm dây sạc điện thoại vào chiếc ổ điện ở góc tường. Bé liền cầm dây sạc của robot, lon ton chạy tới ổ điện thấp ngay cạnh kệ tủ. Nhưng tay Shopee vẫn còn ướt nước, vì lúc nãy bé vừa uống nước và làm đổ một ít ra tay mà chưa lau. Bé lẩm bẩm: Cắm vào đây giống bố làm là được nè."},{"image":"page3.png","audio":"audio/03.mp3","text":"Đúng lúc đó, ngoài cửa vang lên tiếng còi quen thuộc: bíp bíp! Xe cứu hỏa Roy và xe cứu thương Amber ghé qua nhà Shopee để kiểm tra an toàn quanh khu phố trước mùa mưa bão. Nhìn qua cửa sổ, Roy thấy Shopee đang cầm phích cắm bằng bàn tay ướt, chuẩn bị cắm vào ổ điện. Roy vội kêu lớn: Shopee, dừng lại ngay! Đừng cắm phích điện nhé!"},{"image":"page4.png","audio":"audio/04.mp3","text":"Shopee giật mình, rụt tay lại. Mẹ nghe tiếng cũng vội chạy từ bếp ra, dắt bé ra hiên nhà. Roy nói nghiêm túc nhưng ấm áp: Em suýt làm một việc rất nguy hiểm đấy. Tay em đang ướt mà chạm vào phích cắm và ổ điện thì có thể bị điện giật! Shopee tròn mắt ngơ ngác hỏi: Điện giật là gì hả anh Roy? Em thấy bố cắm sạc suốt mà có sao đâu ạ? Roy từ tốn giải thích: Bên trong ổ điện có dòng điện chạy qua, giúp đèn sáng, quạt quay, ti vi hoạt động. Nhưng điện cũng giống như một chú hổ vô hình: mình không nhìn thấy nó, nhưng nếu chạm vào, nó sẽ cắn rất đau. Vì vậy chỉ người lớn mới được cắm và rút phích điện thôi."},{"image":"page5.png","audio":"audio/05.mp3","text":"Amber dịu dàng nói thêm: Đặc biệt là nước dẫn điện rất nhanh. Nếu tay ướt mà chạm vào ổ điện hay phích cắm, điện sẽ truyền qua người, làm em bị giật, bị bỏng, nguy hiểm lắm. Chị đã từng phải chở nhiều người bị điện giật đi cấp cứu rồi đấy. Shopee sợ quá, nép vào lòng mẹ. Mẹ ôm bé, nhẹ nhàng dặn: May quá có anh Roy nhắc kịp. Từ nay khi robot hết pin, con hãy mang đến nhờ bố mẹ sạc giúp, tuyệt đối không tự cắm hay rút phích điện. Shopee ngoan ngoãn: Dạ, con nhớ rồi ạ. Con xin lỗi mẹ."},{"image":"page6.png","audio":"audio/06.mp3","text":"Vừa lúc đó, bố đi làm về. Nghe Roy kể lại, bố liền lấy trong túi đồ ra những chiếc nắp nhựa nhỏ màu trắng. Bố nói: Đây là nắp che ổ điện. Bố sẽ lắp vào tất cả các ổ điện thấp trong nhà. Shopee xem này, lắp vào là không ai chọc ngón tay hay que vào được nữa. Shopee tò mò ngồi xem bố lắp từng chiếc nắp che thật gọn gàng."},{"image":"page7.png","audio":"audio/07.mp3","text":"Roy gật gù hài lòng rồi dặn thêm: Shopee ơi, em nhớ mấy điều này nhé. Không bao giờ chọc ngón tay, que sắt, kéo hay chìa khóa vào lỗ ổ điện. Không cắn hay nghịch dây điện, không kéo dây điện chơi như dây thừng. Và nếu thấy dây điện bị hở, bị sờn hay ngửi thấy mùi khét, em phải chạy đi báo ngay cho người lớn. Shopee nhắc lại thật to: Dạ! Không chọc vào ổ điện, không nghịch dây điện, thấy gì lạ là báo bố mẹ ngay ạ! Amber mỉm cười khen: Giỏi lắm! Còn một điều nữa: khi tay ướt hoặc vừa tắm xong, em không được chạm vào công tắc đèn, quạt hay bất cứ đồ điện nào. Phải lau tay thật khô trước đã."},{"image":"page8.png","audio":"audio/08.mp3","text":"Mẹ sạc pin giúp robot của Shopee. Một lát sau, chú robot lại đi tới đi lui vui vẻ. Shopee reo lên thích thú: Robot khỏe lại rồi! Cảm ơn mẹ, cảm ơn anh Roy và chị Amber ạ!"},{"image":"page9.png","audio":"audio/09.mp3","text":"Mưa đã tạnh, trời hửng nắng. Shopee cùng bố mẹ tiễn Roy và Amber ra đầu ngõ. Đi ngang qua cột điện cao to bên đường, Roy dừng lại, hướng về tấm biển màu vàng có hình tia sét đỏ: Shopee nhìn này. Biển có hình tia sét nghĩa là nguy hiểm, điện cao thế. Em tuyệt đối không lại gần, không trèo, không buộc dây hay chơi đùa quanh cột điện và trạm điện nhé."},{"image":"page10.png","audio":"audio/10.mp3","text":"Amber dặn thêm: Khi thả diều, em cũng phải ra chỗ đồng trống thật xa đường dây điện. Nếu diều vướng vào dây điện thì bỏ luôn, không được kéo dây hay trèo lên lấy. Và sau mưa bão, nếu thấy dây điện bị đứt rơi xuống đường, em phải tránh thật xa và báo ngay cho người lớn. Shopee ngước nhìn tấm biển, gật đầu thật mạnh: Dạ, em nhớ rồi! Ở nhà không nghịch ổ điện, ra đường không lại gần cột điện. Điện giống chú hổ vô hình, mình phải tránh xa ạ! Roy và Amber cùng bật cười, nháy đèn chào tạm biệt. Tối hôm đó, trước khi đi ngủ, Shopee chỉ cho bố xem từng chiếc nắp che ổ điện đã được lắp gọn gàng, rồi thì thầm: Bố ơi, từ nay robot hết pin con sẽ nhờ bố mẹ sạc. Con không tự cắm điện nữa đâu ạ."},{"image":"page11.png","audio":"audio/11.mp3","text":"Bài học cho bé. Điện rất hữu ích nhưng cũng rất nguy hiểm, bé hãy nhớ. Một, không chọc ngón tay, que, kéo hay bất cứ vật gì vào ổ điện; chỉ người lớn mới được cắm và rút phích điện. Hai, không chạm vào ổ điện, phích cắm, công tắc hay đồ điện khi tay đang ướt, phải lau tay thật khô trước. Ba, không nghịch, không kéo, không cắn dây điện; thấy dây điện hở, sờn hay có mùi khét phải báo ngay cho người lớn. Bốn, ở ngoài đường, bé không lại gần, không trèo, không chơi đùa quanh cột điện và trạm điện có biển tia sét cảnh báo. Năm, thả diều ở nơi xa đường dây điện; diều vướng dây thì không kéo, không trèo lấy; thấy dây điện đứt rơi xuống đường phải tránh xa và báo người lớn. Bé biết tránh xa nguồn điện nguy hiểm là bé đã biết tự bảo vệ mình rồi đấy!"}]},{"n":14,"title":"Shopee và ngôi nhà của đồ chơi","base":"Shopee-story-14","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee và ngôi nhà của đồ chơi. Bài học hôm nay: chơi xong, mình cất đồ chơi về đúng chỗ, để nhà vừa gọn gàng sạch đẹp, vừa an toàn cho cả nhà nhé!"},{"image":"page1.png","audio":"audio/01.mp3","text":"Chiều nay, bé Shopee chơi ở phòng khách vui ơi là vui. Bé bày ra nào là robot, ô tô đồ chơi, khối xếp hình, gấu bông, rồi cả bộ tranh ghép nhiều mảnh nữa. Chơi món này một chút, bé lại bỏ đấy, với tay lấy món khác. Chẳng mấy chốc, sàn nhà đầy ắp đồ chơi, chẳng còn chỗ nào để bước chân."},{"image":"page2.png","audio":"audio/02.mp3","text":"Mẹ bưng đĩa trái cây từ bếp đi ra. Vừa bước được hai bước, mẹ bỗng kêu lên: Ối! Mẹ giẫm phải chiếc ô tô đồ chơi, loạng choạng suýt ngã, đĩa trái cây nghiêng hẳn đi. May mà mẹ kịp vịn vào thành ghế. Shopee giật mình quay lại, chạy vội tới ôm chân mẹ, lo lắng hỏi: Mẹ ơi, mẹ có sao không ạ?"},{"image":"page3.png","audio":"audio/03.mp3","text":"Mẹ ôm bé, dịu dàng nói: Mẹ không sao, nhưng nguy quá. Con xem này, đồ chơi nằm khắp sàn, ai đi qua cũng có thể giẫm phải và ngã đau đấy. Chơi xong, mình phải cất đồ chơi về chỗ cũ chứ. Shopee phụng phịu: Nhưng mà... dọn dẹp chán lắm mẹ ơi. Con chơi xong lại muốn chơi tiếp mà. Mẹ chỉ mỉm cười xoa đầu bé. Tối đó, đồ chơi vẫn nằm ngổn ngang, và Shopee phải đi ngủ với một góc phòng bừa bộn."},{"image":"page4.png","audio":"audio/04.mp3","text":"Sáng hôm sau là Chủ nhật, mẹ dắt Shopee đi bộ ra siêu thị ShopeeMart mua đồ. Vừa ra tới đầu phố, Shopee đã nghe tiếng máy chạy rì rì vui tai. Một chiếc xe màu xanh lá pha cam đang chầm chậm đi dọc vỉa hè, cánh tay máy thoăn thoắt gom từng chiếc lá rụng, từng mẩu giấy vụn. Shopee reo lên: A! Bạn Cleany! Mẹ ơi, bạn Cleany quét dọn phố mình đây mà! Cleany nghe thấy liền quay lại, nháy đèn chào thân thiện: Chào Shopee! Lâu rồi mới gặp em. Sáng nào tớ cũng đi gom rác và lá rụng, để đường phố sạch sẽ gọn gàng cho mọi người đi lại an toàn đấy."},{"image":"page5.png","audio":"audio/05.mp3","text":"Shopee tròn mắt nhìn đoạn vỉa hè phía sau Cleany: sạch bong, không một cọng rác. Còn đoạn phía trước thì lá rụng và giấy vụn vẫn nằm rải rác. Bé hỏi: Oa, chỗ nào bạn Cleany đi qua là sạch đẹp hẳn luôn! Nhưng ngày nào cũng dọn vậy bạn có chán không? Cleany cười, cánh tay máy vẫn thoăn thoắt: Không hề! Tớ có bí quyết riêng: tớ coi mỗi buổi dọn dẹp là một trò chơi đi tìm kho báu. Mỗi chiếc lá, mỗi mẩu rác là một kho báu phải thu thập cho bằng hết. Dọn xong nhìn con đường sạch bong, tớ vui lắm! Mà em biết không, đường phố sạch gọn thì xe cộ không bị trượt ngã, các bạn nhỏ chạy chơi cũng không vấp phải thứ gì nguy hiểm. Shopee chợt nhớ tới chuyện mẹ suýt ngã tối qua, im lặng cúi đầu."},{"image":"page6.png","audio":"audio/06.mp3","text":"Ở sân sau siêu thị, một chiếc xe nâng nhỏ màu cam đang nhấc từng thùng hàng, vừa làm vừa nói chuyện rôm rả. Lifty hô vang: Thùng sữa về kệ số một nào! Thùng bánh quy về kệ số hai! Bạn nào về nhà bạn nấy, không lạc đi đâu được! Rồi Lifty quay sang, nháy đèn lia lịa nói với Shopee: Chào em bé! Em thấy không, ở siêu thị này, món đồ nào cũng có một ngôi nhà riêng: sữa có nhà của sữa, bánh có nhà của bánh, đồ chơi có nhà của đồ chơi. Xếp đúng nhà thì cần gì là tìm thấy ngay, kệ hàng lại đẹp như tranh!"},{"image":"page7.png","audio":"audio/07.mp3","text":"Shopee ngạc nhiên hỏi: Ngôi nhà của đồ chơi ạ? Đồ chơi cũng có nhà hả anh Lifty? Lifty đáp: Có chứ! Em thử nghĩ xem, nếu tối nay em được ngủ ngoài sàn nhà lạnh ngắt thay vì cái giường êm ấm của em, em có buồn không? Đồ chơi cũng vậy đó. Chơi xong mà bị bỏ lăn lóc giữa sàn, các bạn ấy tủi thân lắm. Đưa các bạn ấy về đúng nhà, hôm sau muốn chơi là thấy ngay, không phải tìm loạn cả lên! Shopee nghĩ tới chú robot yêu quý đang nằm chỏng chơ giữa sàn nhà, bỗng thấy thương thương."},{"image":"page8.png","audio":"audio/08.mp3","text":"Đúng lúc đó, ngoài đường vang lên tiếng còi quen thuộc: bíp bíp! Xe cảnh sát Poli đi tuần ngang qua, ghé vào chào mọi người: Chào cả nhà! Hôm nay phố mình sạch đẹp quá. Shopee chạy tới, líu lo kể cho Poli nghe chuyện tối qua mẹ suýt ngã vì giẫm phải ô tô đồ chơi. Poli gật gù, giọng ân cần: Anh đi tuần nhiều nơi, thấy không ít bạn nhỏ và cả người lớn bị vấp ngã chỉ vì đồ đạc vứt bừa trên sàn đấy. Gọn gàng không chỉ để đẹp đâu em, mà còn để an toàn nữa. Shopee gật đầu: Dạ, em hiểu rồi ạ. Hôm nay về nhà, em sẽ đưa hết đồ chơi về nhà của các bạn ấy! Poli khen: Giỏi lắm! Em làm giống Cleany này: biến dọn dẹp thành trò chơi là vui ngay thôi."},{"image":"page9.png","audio":"audio/09.mp3","text":"Về đến nhà, Shopee xắn tay áo, đứng giữa phòng khách dõng dạc tuyên bố: Trò chơi Đưa đồ chơi về nhà bắt đầu! Mẹ ơi, mẹ bấm giờ cho con nhé! Mẹ bật cười, giơ đồng hồ lên. Shopee nhanh nhẹn chạy khắp phòng: robot và ô tô về thùng màu xanh, khối xếp hình về hộp màu đỏ, gấu bông ngồi ngay ngắn lên kệ, tranh ghép gom về túi cài kín. Bé vừa dọn vừa hô to giống anh Lifty: Bạn nào về nhà bạn nấy! Một loáng sau, sàn phòng khách đã sạch bong, rộng thênh thang. Đúng lúc đó, bố đi làm về, đứng ở cửa ngạc nhiên huýt sáo: Ơ, phòng khách nhà mình hôm nay đẹp như siêu thị ShopeeMart vậy! Ai dọn mà tài thế nhỉ? Shopee khoe: Con ạ! Con tự dọn hết đấy bố! Bố bế bổng Shopee lên, xoay một vòng. Mẹ nhìn quanh căn phòng gọn gàng, mỉm cười: Hôm nay mẹ đi lại thoải mái, không sợ giẫm phải gì nữa rồi. Cảm ơn con trai của mẹ nhé!"},{"image":"page10.png","audio":"audio/10.mp3","text":"Bài học cho bé. Gọn gàng ngăn nắp giúp nhà mình vừa sạch đẹp vừa an toàn. Bé hãy nhớ: Một, chơi xong món nào, cất món đó về đúng chỗ — mỗi món đồ chơi đều có một ngôi nhà riêng: thùng, hộp, kệ hay túi đựng. Hai, đồ chơi vứt bừa trên sàn có thể làm bố mẹ, ông bà và cả bé bị vấp ngã rất nguy hiểm. Ba, cất đồ đúng chỗ thì hôm sau muốn chơi là tìm thấy ngay, không mất công tìm kiếm. Bốn, hãy biến dọn dẹp thành trò chơi vui — thi xem ai dọn nhanh, ai đưa được nhiều bạn đồ chơi về nhà nhất. Bé tự dọn đồ chơi của mình là bé đã lớn, biết yêu thương đồ chơi và giúp đỡ bố mẹ rồi đấy!"}]},{"n":15,"title":"Shopee và chuyến du lịch Đà Nẵng","base":"Shopee-story-15","cover":"cover.png","slides":[{"image":"cover.png","audio":"audio/00-cover.mp3","text":"Shopee và chuyến du lịch Đà Nẵng. Bài học hôm nay: những kỹ năng cần nhớ khi đi du lịch xa — xếp hàng và đi sát bố mẹ ở sân bay, thắt dây an toàn và ngồi ngoan trên máy bay, tắm biển an toàn, thử món ăn mới, và không xả rác. Mình cùng theo chân bé Shopee nhé!"},{"image":"page1.png","audio":"audio/01.mp3","text":"Tối hôm ấy, cả nhà Shopee rộn ràng như có hội. Bố trải tấm bản đồ ra bàn và reo lên rằng ngày mai cả nhà sẽ bay đến Đà Nẵng — thành phố có biển xanh, cát trắng và một cây cầu hình con rồng biết phun lửa. Mẹ kéo chiếc vali nhỏ màu cam ra, bảo Shopee tự xếp đồ của mình: mũ rộng vành, kính bơi, quần áo, một bạn gấu bông, và cả đội Robocar cứu hộ tí hon nữa. Shopee nâng niu đặt bốn bạn Poli, Roy, Amber và Helly ngồi ngay ngắn trong vali, gọn gàng như một đội cứu hộ nhỏ xíu sẵn sàng lên đường."},{"image":"page2.png","audio":"audio/02.mp3","text":"Sáng sớm, cả nhà ra sân bay. Ôi chao, sân bay rộng ơi là rộng, người đông như trẩy hội. Shopee tròn mắt nhìn quanh, chỉ muốn chạy ùa đi xem. Nhưng mẹ đã nắm chặt bàn tay nhỏ của bé và dặn: ở sân bay đông người, con phải luôn nắm tay bố mẹ, không được chạy lung tung kẻo bị lạc. Rồi mẹ chỉ cho bé thấy mọi người đang đứng nối đuôi nhau thành hàng dài. Bố giải thích đó là xếp hàng: ai đến trước đứng trước, không chen lấn xô đẩy. Shopee ngoan ngoãn đứng vào hàng cùng bố mẹ, kiên nhẫn chờ đến lượt, được chú nhân viên khen giỏi và dán cho vali một chiếc tem máy bay xinh xắn."},{"image":"page3.png","audio":"audio/03.mp3","text":"Qua cửa kiểm tra, cả nhà ra đến sân đỗ. Trước mắt Shopee là một chiếc máy bay màu xanh pha cam, hai cánh quạt tròn xoe, trên đuôi có chữ C thật to. Chiếc máy bay nháy đèn chào và cất giọng vui vẻ giới thiệu mình tên là Carey, hôm nay vinh dự được chở cả nhà Shopee bay đến Đà Nẵng. Shopee ngước nhìn, xuýt xoa rằng anh Carey to ơi là to, rồi lo lắng hỏi bay cao như vậy ngồi trên lưng anh có bị rơi không."},{"image":"page4.png","audio":"audio/04.mp3","text":"Carey trấn an Shopee: không sao đâu, chỉ cần nhớ một điều thật quan trọng — lên máy bay là phải ngồi đúng ghế của mình và thắt dây an toàn ngay. Dây an toàn giống như vòng tay của Carey ôm chặt em, dù máy bay có nghiêng cánh hay rung lắc một chút, em vẫn ngồi êm trong ghế. Cả nhà ngồi vào chỗ, mẹ giúp Shopee cài dây an toàn, tách một tiếng thật gọn. Shopee tự kéo thử dây, thấy mình được ôm chắc chắn nên yên tâm lắm."},{"image":"page5.png","audio":"audio/05.mp3","text":"Carey nổ máy, hai cánh quạt quay tròn vù vù. Máy bay chạy nhanh dần trên đường băng rồi nhấc bổng lên trời. Bỗng tai Shopee ù ù như có chú ong vo ve bên trong, bé nhăn mặt ôm tai kêu khó chịu. Mẹ nhẹ nhàng bảo: không sao đâu con, khi máy bay lên cao tai mình hay bị ù như vậy, con thử ngáp một cái thật to, hoặc nuốt nước bọt xem sao. Shopee ngáp một cái hà thật to rồi nuốt ực, póc một tiếng, tai bé hết ù thật. Bé cười toe toét."},{"image":"page6.png","audio":"audio/06.mp3","text":"Shopee quay sang nhìn ra cửa sổ. Ôi chao, cả thành phố bên dưới bé xíu như đồ chơi, những đám mây trắng bồng bềnh như kẹo bông trôi ngang cánh máy bay. Bé thích thú reo lên: mây kìa mẹ ơi, con đang bay cao hơn cả mây!"},{"image":"page7.png","audio":"audio/07.mp3","text":"Đang say sưa ngắm mây, Shopee bỗng thấy chân muốn đung đưa, đạp đạp vào lưng ghế phía trước cho vui. Bố nhẹ nhàng giữ chân bé lại và chỉ cho bé thấy phía trước là ghế của một bà cụ đang ngủ. Nếu con đạp vào lưng ghế, bà sẽ giật mình đau lưng đấy. Trên máy bay có nhiều người cùng ngồi, mình ngồi ngoan, nói chuyện vừa đủ nghe, không la hét, thì ai cũng được nghỉ ngơi thoải mái. Shopee liền xin lỗi và hứa sẽ ngồi ngoan như anh Carey bay êm."},{"image":"page8.png","audio":"audio/08.mp3","text":"Carey nghe thấy, khẽ rung cánh khen Shopee giỏi, rồi báo sắp đến Đà Nẵng, đèn dây an toàn vừa sáng lên. Carey dặn khi đèn này sáng, mọi người phải ngồi yên tại ghế và kiểm tra dây an toàn để chuẩn bị hạ cánh. Máy bay nghiêng cánh lượn một vòng. Qua ô cửa sổ, Shopee reo lên khi thấy biển xanh mênh mông lấp lánh nắng, bờ cát trắng chạy dài. Carey hạ cánh êm ru rồi tạm biệt cả nhà, hẹn gặp lại ở chuyến bay về. Shopee cảm ơn rối rít: anh Carey bay êm ơi là êm!"},{"image":"page9.png","audio":"audio/09.mp3","text":"Vừa ra khỏi sân bay, một chiếc taxi màu vàng bóng loáng, sọc ca-rô đen trắng đã đỗ chờ sẵn, sạch đến mức soi gương được. Chiếc xe nháy đèn chào, giới thiệu mình là Cap, taxi sạch nhất Đà Nẵng. Lên xe, Shopee nhớ ngay bài học của anh Carey nên tự giác kéo dây an toàn. Cap khen bé ngoan và dặn thêm: ngồi trong xe thì không thò đầu, thò tay ra ngoài cửa sổ vì gió mạnh và xe cộ bên ngoài nguy hiểm lắm; rồi nhờ Shopee giữ chiếc bánh ăn dở cẩn thận kẻo vụn rơi ra ghế. Shopee cười khúc khích, gói chiếc bánh lại bỏ vào túi mẹ, hứa giữ xe anh sạch bong."},{"image":"page10.pn
