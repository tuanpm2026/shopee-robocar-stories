<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>__TITLE__</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #1a1423; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* ---- Stage ---- */
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.6);
    animation: fadeIn .6s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: scale(1); } }

  /* ---- Tap zones ---- */
  .tapzone { position: fixed; top: 0; bottom: 120px; width: 28%; z-index: 5; cursor: pointer; }
  #tapPrev { left: 0; } #tapNext { right: 0; }

  /* ---- Caption ---- */
  #caption {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 86px;
    max-width: min(92vw, 700px); max-height: 32vh; overflow-y: auto;
    background: rgba(20, 14, 30, .82); backdrop-filter: blur(8px);
    color: #fff7ea; font-size: clamp(15px, 2.2vmin, 19px); line-height: 1.55;
    padding: 14px 18px; border-radius: 14px; z-index: 6;
    display: none; white-space: pre-wrap;
  }
  body.show-caption #caption { display: block; }

  /* ---- Control bar ---- */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 76px; z-index: 10;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(transparent, rgba(10,6,16,.85) 40%);
  }
  #bar button {
    border: none; border-radius: 50%; width: 48px; height: 48px;
    background: rgba(255,255,255,.12); color: #fff; font-size: 20px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
  }
  #bar button:active { transform: scale(.92); }
  #bar button:hover { background: rgba(255,255,255,.25); }
  #btnPlay { width: 60px !important; height: 60px !important; font-size: 26px !important; background: #ff7a2f !important; }
  #pageNum { color: #ffd9b3; font-size: 15px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }

  /* ---- Progress dots ---- */
  #dots { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; z-index: 10; }
  #dots span { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.25); cursor: pointer; transition: all .2s; }
  #dots span.done { background: rgba(255,170,90,.55); }
  #dots span.cur { background: #ff7a2f; transform: scale(1.35); }

  /* ---- Start overlay ---- */
  #startOverlay {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px; text-align: center;
    background: radial-gradient(ellipse at center, #3b2a55 0%, #1a1423 75%);
    padding: 24px;
  }
  #startOverlay h1 { color: #ffe9cf; font-size: clamp(22px, 4.5vmin, 38px); max-width: 80vw; line-height: 1.3; text-shadow: 0 3px 16px rgba(0,0,0,.5); }
  #startOverlay .sub { color: #bda8d8; font-size: clamp(14px, 2.2vmin, 18px); }
  #startCover { width: min(38vh, 70vw); border-radius: 12px; box-shadow: 0 10px 50px rgba(0,0,0,.7); }
  #btnStart {
    border: none; background: linear-gradient(135deg, #ff8c42, #ff5e3a); color: #fff;
    font-size: clamp(18px, 3vmin, 24px); font-weight: 700; padding: 16px 44px;
    border-radius: 999px; cursor: pointer; box-shadow: 0 6px 26px rgba(255,110,60,.45);
    transition: transform .12s;
  }
  #btnStart:active { transform: scale(.95); }

  /* ---- End overlay ---- */
  #endOverlay {
    position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: rgba(18, 12, 28, .9); backdrop-filter: blur(6px); text-align: center; padding: 24px;
  }
  #endOverlay.show { display: flex; }
  #endOverlay h2 { color: #ffe9cf; font-size: clamp(22px, 4vmin, 34px); }
  #endOverlay button {
    border: none; background: linear-gradient(135deg, #ff8c42, #ff5e3a); color: #fff;
    font-size: 18px; font-weight: 700; padding: 14px 36px; border-radius: 999px; cursor: pointer;
  }
</style>
</head>
<body class="show-caption">

<div id="stage"><img id="slideImg" src="__COVER__" alt="trang truyện"></div>

<div id="tapPrev" class="tapzone"></div>
<div id="tapNext" class="tapzone"></div>

<div id="caption"></div>

<div id="dots"></div>

<div id="bar">
  <button id="btnPrev" title="Trang trước">⏮</button>
  <button id="btnPlay" title="Phát / Dừng">▶</button>
  <button id="btnNext" title="Trang sau">⏭</button>
  <span id="pageNum"></span>
  <button id="btnReplay" title="Đọc lại trang này">🔁</button>
  <button id="btnCaption" title="Ẩn / hiện chữ">Aa</button>
</div>

<div id="startOverlay">
  <img id="startCover" src="__COVER__" alt="bìa truyện">
  <h1>__TITLE__</h1>
  <div class="sub">Giọng kể: chị __VOICE_LABEL__ &nbsp;•&nbsp; __SLIDE_COUNT__ trang</div>
  <button id="btnStart">▶ &nbsp;Bắt đầu đọc truyện</button>
</div>

<div id="endOverlay">
  <h2>🎉 Hết truyện rồi! Bé giỏi lắm!</h2>
  <button id="btnAgain">📖 Đọc lại từ đầu</button>
</div>

<script>
const SLIDES = __SLIDES_JSON__;

const AUTO_ADVANCE_DELAY = 1000; // ms nghỉ sau khi đọc xong trước khi lật trang

const img = document.getElementById("slideImg");
const caption = document.getElementById("caption");
const pageNum = document.getElementById("pageNum");
const dots = document.getElementById("dots");
const btnPlay = document.getElementById("btnPlay");
const endOverlay = document.getElementById("endOverlay");

let cur = 0;
let playing = false;       // chế độ tự động kể chuyện đang bật
let advanceTimer = null;
const audio = new Audio();

// dots
SLIDES.forEach((_, i) => {
  const d = document.createElement("span");
  d.addEventListener("click", () => go(i, true));
  dots.appendChild(d);
});

function render() {
  const s = SLIDES[cur];
  img.src = s.image;
  caption.textContent = s.text;
  caption.scrollTop = 0;
  pageNum.textContent = (cur === 0 ? "Bìa" : "Trang " + cur) + " / " + (SLIDES.length - 1);
  [...dots.children].forEach((d, i) => {
    d.className = i < cur ? "done" : i === cur ? "cur" : "";
  });
  // preload trang kế tiếp
  if (cur + 1 < SLIDES.length) { (new Image()).src = SLIDES[cur + 1].image; }
}

function playCurrent() {
  clearTimeout(advanceTimer);
  audio.src = SLIDES[cur].audio;
  audio.play().catch(() => {});
  btnPlay.textContent = "⏸";
}

function stopAudio() {
  clearTimeout(advanceTimer);
  audio.pause();
  btnPlay.textContent = "▶";
}

function go(i, manual) {
  if (i < 0 || i >= SLIDES.length) return;
  cur = i;
  endOverlay.classList.remove("show");
  render();
  if (playing || manual) playCurrent();
}

audio.addEventListener("ended", () => {
  if (!playing) { btnPlay.textContent = "▶"; return; }
  if (cur + 1 < SLIDES.length) {
    advanceTimer = setTimeout(() => go(cur + 1), AUTO_ADVANCE_DELAY);
  } else {
    playing = false;
    btnPlay.textContent = "▶";
    endOverlay.classList.add("show");
  }
});

// ---- Controls ----
document.getElementById("btnStart").addEventListener("click", () => {
  document.getElementById("startOverlay").remove();
  playing = true;
  go(0);
});
document.getElementById("btnAgain").addEventListener("click", () => { playing = true; go(0); });
document.getElementById("btnPrev").addEventListener("click", () => go(cur - 1, true));
document.getElementById("btnNext").addEventListener("click", () => go(cur + 1, true));
document.getElementById("tapPrev").addEventListener("click", () => go(cur - 1, true));
document.getElementById("tapNext").addEventListener("click", () => go(cur + 1, true));
document.getElementById("btnReplay").addEventListener("click", playCurrent);
document.getElementById("btnCaption").addEventListener("click", () => document.body.classList.toggle("show-caption"));

btnPlay.addEventListener("click", () => {
  if (audio.paused) {
    playing = true;
    if (audio.src && !audio.ended) { audio.play(); btnPlay.textContent = "⏸"; }
    else playCurrent();
  } else {
    playing = false;
    stopAudio();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(cur + 1, true);
  else if (e.key === "ArrowLeft") go(cur - 1, true);
  else if (e.key === " ") { e.preventDefault(); btnPlay.click(); }
});

render();
</script>
</body>
</html>
